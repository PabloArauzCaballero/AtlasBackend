            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestType:
                  type: string
                  enum:
                    - access
                    - rectification
                    - deletion
                    - portability
                    - revocation
                    - restriction
                description:
                  type: string
                  minLength: 5
                  maxLength: 1000
              required:
                - requestType
              additionalProperties: false
      responses:
        '201':
          description: Solicitud creada — estado "received", vence en 15 días.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          description: X-Idempotency-Key ausente.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Un customer intentó operar sobre otro cliente.
        '404':
          description: Cliente no encontrado.
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Crear solicitud de derechos ARCO/GDPR
      tags:
        - customer-privacy
  /customers/{customerId}/telemetry/batch:
    post:
      description: >-
        Recibe hasta 100 eventos + 100 métricas on-device por batch (interacción
        de formulario, permisos, auth, riesgo de dispositivo, SIM, reputación de
        IP, pasos de onboarding, acciones del cliente). Rechaza el batch
        completo si detecta indicios de volcado de agenda de contactos cruda
        (`RAW_CONTACTS_NOT_ALLOWED`). Un `customer` solo puede reportar
        telemetría de un dispositivo/sesión vinculados a sí mismo.
      operationId: CustomerTelemetryController_ingestBatch
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                  pattern: ^[1-9][0-9]*$
                deviceId:
                  type: string
                  pattern: ^[1-9][0-9]*$
                clientBatchId:
                  type: string
                  minLength: 3
                  maxLength: 120
                capturedFrom:
                  type: string
                  format: date-time
                  pattern: >-
                    ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                capturedUntil:
                  type: string
                  format: date-time
                  pattern: >-
                    ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                events:
                  default: []
                  maxItems: 100
                  type: array
                  items:
                    type: object
                    properties:
                      eventType:
                        type: string
                        enum:
                          - form_field_interaction
                          - permission_event
                          - auth_event
                          - device_risk_event
                          - sim_observation
                          - ip_reputation_observation
                          - customer_observation
                          - customer_action
                          - onboarding_step_event
                      eventCode:
                        type: string
                        minLength: 1
                        maxLength: 120
                      occurredAt:
                        type: string
                        format: date-time
                        pattern: >-
                          ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      metadata:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                    required:
                      - eventType
                      - eventCode
                      - occurredAt
                    additionalProperties: false
                onDeviceMetrics:
                  default: []
                  maxItems: 100
                  type: array
                  items:
                    type: object
                    properties:
                      metricCode:
                        type: string
                        minLength: 1
                        maxLength: 120
                      value:
                        anyOf:
                          - type: number
                          - type: string
                            maxLength: 500
                          - type: boolean
                          - type: object
                            propertyNames:
                              type: string
                            additionalProperties: {}
                      computedAt:
                        type: string
                        format: date-time
                        pattern: >-
                          ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                      confidenceScore:
                        type: number
                        minimum: 0
                        maximum: 1
                    required:
                      - metricCode
                      - value
                    additionalProperties: false
              required:
                - sessionId
                - deviceId
                - clientBatchId
                - capturedFrom
                - capturedUntil
                - events
                - onDeviceMetrics
              additionalProperties: false
      responses:
        '202':
          description: Batch aceptado — cantidad de eventos/métricas procesados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          description: X-Idempotency-Key ausente, batch vacío, o payload > 250 KB.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El dispositivo o la sesión no pertenecen al cliente.
        '404':
          description: Cliente no encontrado.
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: >-
            RAW_CONTACTS_NOT_ALLOWED — el batch contiene indicios de agenda de
            contactos cruda.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Ingerir batch de telemetría del cliente
      tags:
        - customer-telemetry
  /customers/{customerId}/risk-assessments:
    post:
      description: >-
        Calcula un score de riesgo/fraude nuevo para el cliente (identidad,
        contacto, dispositivo, comportamiento) y registra la decisión
        resultante. Exige al menos un consentimiento vigente otorgado antes de
        ejecutar. Si faltan datos obligatorios (documento de identidad, contacto
