# Stack local de Atlas Backend: infraestructura + los tres roles de proceso.
#
# Este archivo describe el DESPLIEGUE LOCAL. La forma de producción vive en
# `docker-compose.prod.yml`, que no lleva ningún secreto por defecto.
#
# Perfiles — cada uno responde a una forma distinta de trabajar:
#
#   docker compose up -d
#       Sólo la infraestructura (PostgreSQL + Redis). Es lo que hace falta para `yarn start:dev`,
#       que conserva el ciclo de recarga en caliente.
#
#   docker compose --profile app up -d --build
#       Stack completo containerizado: migraciones (one-shot) → API → worker. Ningún proceso queda
#       fuera de un contenedor.
#
#   docker compose --profile app --profile logs up -d --build
#       Además MongoDB, para el visor de logs (`GET /systems/logs/mongo`).
#
#   docker compose down -v      # borra también los volúmenes
#
# Eficiencia de la orquestación:
#   - UNA sola imagen para `migrate`, `api` y `worker`: mismo `image:` y mismo contexto de build, así
#     que Compose la construye una vez y las otras dos la reutilizan desde la caché.
#   - `depends_on` por CONDICIÓN, no por orden: la API no arranca hasta que las migraciones
#     terminaron con éxito y Postgres/Redis responden a su healthcheck. Sin esto, el arranque es una
#     carrera que se gana por casualidad.
#   - Los healthchecks son los reales del producto (readiness), no un `sleep`.
#
#   - Los puertos publicados son configurables (`POSTGRES_PUBLISH_PORT`, `API_PUBLISH_PORT`…). Un
#     puerto fijo hace que el stack no arranque en una maquina que ya corre un Postgres local, que es
#     la situacion normal de cualquier desarrollador.
#
# Las versiones de Postgres y Redis coinciden con el job `db-and-cache-integration` de CI. Cambiar
# una aquí sin cambiarla allí reintroduce la divergencia que este archivo existe para evitar.

# Bloque de build compartido por los tres roles. El `image:` idéntico es lo que hace que Compose
# construya una sola vez.
x-atlas-build: &atlas-build
  image: atlas-backend:local
  build:
    context: .
    dockerfile: Dockerfile
    args:
      APP_VERSION: local
      APP_COMMIT_SHA: local
    # `cache_from` permite reutilizar las capas de una imagen ya construida al reconstruir.
    cache_from:
      - atlas-backend:local

# Configuración común a los tres roles: a dónde se conectan y con qué credenciales de DESARROLLO.
# NODE_ENV=development a propósito — este stack es local, y `env.ts` exige secretos reales en
# producción. Para la forma productiva, ver `docker-compose.prod.yml`.
x-atlas-env: &atlas-env
  NODE_ENV: development
  DB_HOST: postgres
  DB_PORT: '5432'
  DB_NAME: atlas
  DB_USER: atlas
  DB_PASSWORD: atlas
  DB_SCHEMA: public
  REDIS_URL: redis://redis:6379
  LOG_FORMAT: json
  # Drenado ordenado ante SIGTERM. En local basta con 5 s: es mayor que el intervalo del healthcheck
  # (15 s no, pero aquí no hay balanceador) y suficiente para ver el comportamiento sin alargar cada
  # `docker compose down`.
  SHUTDOWN_DRAIN_MS: '5000'

  # Plano de sesión, tomado del `.env` de la máquina.

  #

  # Sin esto el contenedor usaba el secreto POR DEFECTO del esquema mientras la máquina firmaba

  # con el suyo, así que los dos lados no podían coincidir: los smokes —que se acuñan un JWT

  # con `JWT_ACCESS_TOKEN_SECRET` del `.env`— recibían 401 «Token inválido o expirado» contra un

  # stack perfectamente sano, y la verificación de extremo a extremo quedaba inservible.

  #

  # Van en forma DESNUDA, no como `${VAR:-}`: así, cuando la máquina no las declara, el

  # contenedor no recibe una cadena vacía —que rompería el `min(32)`— sino nada, y manda el

  # valor por defecto de desarrollo. Producción no puede arrancar con ese defecto: lo bloquea

  # `env-cross-checks.ts`.

  JWT_ACCESS_TOKEN_SECRET:

  JWT_ACCESS_TOKEN_EXPIRES_IN:

  JWT_ISSUER:

  JWT_AUDIENCE:

  # Canal de correo, tomado del `.env` de la máquina.
  #
  # Sin esto el contenedor arrancaba SIEMPRE sin canal, dijera lo que dijera el `.env`: este archivo
  # no tiene `env_file`, así que sólo llega lo que está escrito aquí. Y quedarse sin canal no es un
  # detalle de comodidad — `AuthSecondFactorService.isRequired` devuelve `false` cuando no hay por
  # dónde entregar el PIN, así que un `.env` con proveedor configurado seguía dando logins internos
  # de UN SOLO FACTOR, sin un solo mensaje que lo dijera.
  #
  # Se enumeran una por una en vez de montar el `.env` entero: así el contenedor no hereda por
  # accidente el `DB_HOST` ni los puertos de un desarrollo fuera de Docker. Los valores por omisión
  # reproducen el comportamiento anterior (sin canal), y ninguno es una cadena vacía donde el esquema
  # espere un enum o un prefijo.
  NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-disabled}
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
  GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
  GMAIL_FROM_EMAIL: ${GMAIL_FROM_EMAIL:-}
  MAILSENDER_BASE_URL: ${MAILSENDER_BASE_URL:-}
  MAILSENDER_API_PREFIX: ${MAILSENDER_API_PREFIX:-/api/v1}
  MAILSENDER_EXTERNAL_API_KEY: ${MAILSENDER_EXTERNAL_API_KEY:-}
  MAILSENDER_ADMIN_USERNAME: ${MAILSENDER_ADMIN_USERNAME:-}
  MAILSENDER_ADMIN_PASSWORD: ${MAILSENDER_ADMIN_PASSWORD:-}
  AUTH_LOGIN_PIN_ENABLED: ${AUTH_LOGIN_PIN_ENABLED:-true}
  # Canal por webhook: es como una batería automatizada lee el PIN del segundo factor sin apagarlo
  # (ver `webhook-mail.transport.ts`). El recolector corre fuera de Docker, así que la URL apunta a
  # `host.docker.internal`.
  NOTIFICATION_EMAIL_WEBHOOK_URL: ${NOTIFICATION_EMAIL_WEBHOOK_URL:-}
  NOTIFICATION_WEBHOOK_URL: ${NOTIFICATION_WEBHOOK_URL:-}

  # Los otros dos BLOQUES del ecosistema.
  #
  # Sin estas variables el panel de sistemas reportaba el motor de decisión y el ERP como «no
  # configurados» —correcto pero inútil— y el catálogo de datos y el de endpoints sólo contenían lo
  # de este backend, sin nada que lo dijera. Se apunta a `host.docker.internal` porque cada bloque
  # tiene su propio `docker compose` y su propia red: son productos separados, no servicios de este
  # stack, y meterlos en la misma red los haría parecer una sola cosa.
  #
  # Se usa HEALTH_BASE_URL y no BASE_URL a propósito: BASE_URL enciende la INTEGRACIÓN de crédito y
  # el arranque exige entonces credenciales de ejecución y sal de sujeto. Observar el motor no
  # debería obligar a automatizar el crédito para conseguirlo.
  #
  # El motor no lleva credencial aqui: identifica a quien pregunta verificando su token contra ESTE
  # backend, asi que la federacion reenvia la sesion del operador. El ERP si la lleva, porque no
  # verifica tokens de Atlas —su pasarela los INTERCAMBIA por uno propio— y esa llave abre una sola
  # lectura sin usuario ni roles, de modo que no compite con Atlas como fuente de identidades.
  DECISION_ENGINE_HEALTH_BASE_URL: ${DECISION_ENGINE_HEALTH_BASE_URL:-http://host.docker.internal:3020}
  ERP_BACKEND_BASE_URL: ${ERP_BACKEND_BASE_URL:-http://host.docker.internal:3007}
  ERP_BACKEND_CATALOG_API_KEY: ${ERP_BACKEND_CATALOG_API_KEY:-}

  # Visor de logs (`GET /systems/logs/mongo`) y sincronización de `Archivo.log` hacia MongoDB.
  #
  # El servicio `mongo` del perfil `logs` existía desde hace tiempo, pero esta variable NO se pasaba
  # a la API ni al worker: la receta documentada arriba —`--profile app --profile logs`— levantaba
  # Mongo y aun así el visor contestaba 503 `MONGO_LOGS_NOT_CONFIGURED`, siempre, sin forma de
  # notarlo salvo abriendo la pantalla. Es decir: la única receta para encender la terminal de logs
  # no la encendía.
  #
  # Apuntar por omisión al servicio del propio stack es seguro incluso sin el perfil `logs`:
  # `MongoLogsQueryService` conecta de forma perezosa, en la primera consulta, y traduce el fallo de
  # conexión al mismo 503 que se obtenía antes. Nada arranca peor por tener la variable puesta.
  MONGO_DB_URL_CONNECTION: ${MONGO_DB_URL_CONNECTION:-mongodb://mongo:27017/atlas_logs}

  # Techo de peticiones por minuto y por IP.
  #
  # El default del backend (100/min) está pensado para producción, donde detrás de una IP hay una
  # persona. En LOCAL, detrás de la IP hay una suite: el portal pide `/internal/auth/me` en cada
  # navegación y un barrido E2E de cincuenta vistas agota el cupo a mitad de camino. El síntoma no
  # se parece en nada a la causa —pantallas en blanco, pruebas que fallan en un orden distinto cada
  # vez— así que este valor es lo que separa un fallo real de un límite de desarrollo.
  #
  # Sólo aplica a este compose, que describe el despliegue LOCAL. `docker-compose.prod.yml` no lo
  # define y conserva el default.
  API_RATE_LIMIT_MAX: ${API_RATE_LIMIT_MAX:-2000}

# Sin `container_name`: Compose nombra los contenedores `<proyecto>-<servicio>-<n>`. Un nombre fijo
# impide levantar dos stacks a la vez, choca con cualquier contenedor homónimo que ya exista en la
# máquina y —lo decisivo— hace imposible `--scale api=4`, que es justo la razón de separar los roles.

services:
  # ---------------------------------------------------------------------------------------------
  # Infraestructura
  # ---------------------------------------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - '${POSTGRES_PUBLISH_PORT:-5432}:5432'
    volumes:
      - atlas-postgres-data:/var/lib/postgresql/data
      # Los scripts de roles se montan en solo lectura para poder aplicarlos con `psql` desde el
      # contenedor sin copiarlos:
      #   docker compose exec postgres psql -U atlas -d atlas -f /ops/bootstrap-roles.sql
      - ./ops/postgres:/ops:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atlas -d atlas']
      interval: 5s
      timeout: 5s
      retries: 10
      # 45 s y no 10: tras un cierre sucio (un OOM, un `docker kill`) PostgreSQL tiene que reproducir
      # el WAL antes de aceptar conexiones, y con 10 s el arranque se declaraba fallido justo cuando
      # la base estaba recuperandose bien. `start_period` no cuenta los fallos como definitivos, asi
      # que subirlo no retrasa un arranque sano: solo evita abortar uno lento.
      start_period: 45s

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - '${REDIS_PUBLISH_PORT:-6379}:6379'
    volumes:
      - atlas-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # Sólo para el visor de logs (`GET /systems/logs/mongo`). El backend arranca sin esto: si
  # MONGO_DB_URL_CONNECTION no está configurado, el sync a Mongo queda apagado sin romper nada.
  mongo:
    image: mongo:7
    restart: unless-stopped
    profiles: ['logs']
    ports:
      - '${MONGO_PUBLISH_PORT:-27017}:27017'
    volumes:
      - atlas-mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 10

  # Almacenamiento de la EVIDENCIA documental (KYC del consumidor y QR del comercio), compatible
  # con S3. Va en su propio perfil porque el backend arranca sin él: con `STORAGE_S3_*` vacío los
  # endpoints de subida responden 503 y el resto funciona igual.
  #
  # Existe porque sin un bucket la subida del QR no se puede probar de punta a punta en ninguna
  # batería —el smoke lo reportaba y seguía—, y una evidencia que nunca se ejercita es una
  # evidencia que nadie sabe si se guarda bien.
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    restart: unless-stopped
    profiles: ['storage']
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_S3_ACCESS_KEY_ID:-atlas-local}
      MINIO_ROOT_PASSWORD: ${STORAGE_S3_SECRET_ACCESS_KEY:-atlas-local-secret}
    ports:
      - '${MINIO_PUBLISH_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - atlas-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # Job ONE-SHOT: crea el bucket si no existe. Separado del servidor porque MinIO no crea buckets
  # al arrancar, y un bucket que falta produce un 404 en la subida que se lee como «el archivo no
  # se pudo guardar» en vez de «el almacenamiento no está preparado».
  minio-bucket:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    profiles: ['storage']
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_S3_ACCESS_KEY_ID:-atlas-local} ${STORAGE_S3_SECRET_ACCESS_KEY:-atlas-local-secret} &&
      mc mb --ignore-existing local/${STORAGE_S3_BUCKET:-atlas-evidence} &&
      echo 'bucket listo'
      "

  # ---------------------------------------------------------------------------------------------
  # Roles de proceso (perfil `app`)
  # ---------------------------------------------------------------------------------------------

  # Job ONE-SHOT: aplica migraciones y siembra el perfil de desarrollo. Corre hasta terminar y sale.
  # Existe como servicio propio, y no como un paso dentro del arranque de la API, porque migrar es
  # mutar el esquema: con N réplicas de API sería una carrera, y un fallo de migración debe impedir
  # que la API arranque en vez de dejarla servir contra un esquema a medias.
  migrate:
    <<: *atlas-build
    profiles: ['app']
    environment:
      <<: *atlas-env
      APP_ROLE: all
    depends_on:
      postgres:
        condition: service_healthy
    # Las migraciones y los seeders corren desde el build compilado (`dist/`), no con tsx: la imagen
    # de producción no lleva devDependencies. Ver src/database/migrate.ts.
    command: >
      sh -c "node dist/src/database/migrate.js up &&
             node dist/src/database/seed.js up --profile=development"
    restart: 'no'

  api:
    <<: *atlas-build
    profiles: ['app']
    # `host.docker.internal` no existe fuera de Docker Desktop. Declararlo contra `host-gateway`
    # hace que el mismo compose alcance el motor y el ERP también en Linux, donde si no la
    # federación fallaría con un DNS que no resuelve y parecería un bloque caído.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    environment:
      <<: *atlas-env
      APP_ROLE: api
      APP_PORT: '3005'
      # El planificador NO corre aquí: es el worker quien ejecuta el trabajo de fondo. El
      # cross-check de `env.ts` rechaza la combinación contraria, así que esto no puede desalinearse
      # en silencio.
      RUNTIME_JOBS_SCHEDULER_ENABLED: 'false'
      NOTIFICATIONS_DELIVERY_MODE: deferred
      # `127.0.0.1` además de `localhost`: son orígenes DISTINTOS para el navegador, y las pruebas
      # E2E de Playwright sirven el portal en `127.0.0.1:5273`. Sin esta entrada el login fallaba
      # con «no se pudo conectar con el servicio interno», que parece una caída del backend y es
      # sólo un preflight CORS rechazado.
      CORS_ORIGINS: http://localhost:3000,http://localhost:5273,http://127.0.0.1:3000,http://127.0.0.1:5273
    ports:
      - '${API_PUBLISH_PORT:-3005}:3005'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - atlas-api-logs:/app/logs
    restart: unless-stopped
    # Mayor que SHUTDOWN_DRAIN_MS: si Docker matara el contenedor antes de que termine el drenado,
    # tener drenado no serviría de nada.
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G

  worker:
    <<: *atlas-build
    profiles: ['app']
    environment:
      <<: *atlas-env
      APP_ROLE: worker
      WORKER_PROBE_PORT: '3006'
      RUNTIME_JOBS_SCHEDULER_ENABLED: 'true'
      NOTIFICATIONS_DELIVERY_MODE: deferred
      # El monitor de salud avisa al staff interno cuando una herramienta crítica cae; vive donde
      # vive el trabajo de fondo.
      SYSTEM_HEALTH_MONITOR_ENABLED: 'true'
    ports:
      # Se publica sólo para poder inspeccionar la sonda y las métricas en local. En producción este
      # puerto se queda en la red interna: ver docker-compose.prod.yml.
      - '${WORKER_PROBE_PUBLISH_PORT:-3006}:3006'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - atlas-worker-logs:/app/logs
    command: ['node', 'dist/src/worker.js']
    restart: unless-stopped
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 768M

volumes:
  atlas-postgres-data:
  atlas-redis-data:
  atlas-mongo-data:
  atlas-minio-data:
  # Cada rol escribe SU propio Archivo.log y lo sincroniza a MongoDB por su cuenta: el tail del log
  # es per-proceso, así que compartir un volumen entre API y worker mezclaría dos flujos y ambos
  # procesos competirían por el mismo offset.
  atlas-api-logs:
  atlas-worker-logs:
