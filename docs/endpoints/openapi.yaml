                    - employee
                    - self_employed
                    - business_owner
                    - retired
                    - student
                    - unemployed
                employerName:
                  type: string
                  minLength: 1
                  maxLength: 180
                employmentSeniorityMonths:
                  type: integer
                  minimum: 0
                  maximum: 960
                monthlyIncomeDeclared:
                  type: number
                  minimum: 0
                  maximum: 99999999
                otherMonthlyIncome:
                  type: number
                  minimum: 0
                  maximum: 99999999
                monthlyExpensesDeclared:
                  type: number
                  minimum: 0
                  maximum: 99999999
                economicActivityCode:
                  type: string
                  minLength: 1
                  maxLength: 80
                sourceOfFunds:
                  type: string
                  enum:
                    - salary
                    - business_income
                    - rental_income
                    - pension
                    - remittances
                    - savings
                    - other
              additionalProperties: false
      responses:
        '200':
          description: Atributos económicos actualizados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: PROFILE_NOT_EDITABLE_IN_STATUS o ATTRIBUTE_CATALOG_NOT_SEEDED.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Registrar información laboral y económica (guardado parcial)
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/reference-contacts:
    get:
      description: Devuelve las referencias sin exponer nombre ni teléfono.
      operationId: CustomerOnboardingProfileController_listReferences
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Referencias registradas (solo últimos 4 dígitos del teléfono).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Listar referencias personales
      tags:
        - customer-onboarding
    post:
      description: >-
        Alta de una o varias referencias. Nombre y teléfono se guardan hasheados
        y cifrados: son datos de un tercero. `consentBasis` es obligatorio y
        declara la base legal del tratamiento.
      operationId: CustomerOnboardingProfileController_addReferences
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                references:
                  minItems: 1
                  maxItems: 5
                  type: array
                  items:
                    type: object
                    properties:
                      relationshipType:
                        type: string
                        enum:
                          - family
                          - friend
                          - coworker
                          - employer
                          - commercial
                          - other
                      fullName:
                        type: string
                        minLength: 3
                        maxLength: 180
                      phone:
                        type: string
                        minLength: 6
                        maxLength: 40
                      consentBasis:
                        type: string
                        enum:
                          - customer_declared
                          - legitimate_interest
                          - reference_informed
                    required:
                      - relationshipType
                      - fullName
                      - phone
                      - consentBasis
                    additionalProperties: false
              required:
                - references
              additionalProperties: false
      responses:
        '201':
          description: Referencias registradas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            REFERENCE_ALREADY_REGISTERED — ese teléfono ya figura como
            referencia.
        '422':
          description: REFERENCE_LIMIT_EXCEEDED o REFERENCE_CANNOT_BE_THE_CUSTOMER.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Registrar referencias personales
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/reference-contacts/{referenceId}:
    delete:
      description: 'Borrado lógico: la declaración original se conserva.'
      operationId: CustomerOnboardingProfileController_removeReference
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: customerId
          in: path
          required: true
          description: Identificador de ruta `customerId`.
          schema:
            type: string
        - name: referenceId
          in: path
          required: true
          description: Identificador de ruta `referenceId`.
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Referencia retirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: REFERENCE_NOT_FOUND.
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Quitar una referencia personal
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/contact-methods:
    post:
      description: >-
        Registra un teléfono o correo adicional en estado `unverified`. Resuelve
        el caso de un contacto mal escrito en el registro, que antes dejaba la
        cuenta sin forma de recibir el código de verificación.
      operationId: CustomerOnboardingProfileController_addContactMethod
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactType:
                  type: string
                  enum:
                    - phone
                    - email
                value:
                  type: string
                  minLength: 6
                  maxLength: 180
                label:
                  type: string
                  minLength: 1
                  maxLength: 60
              required:
                - contactType
                - value
              additionalProperties: false
      responses:
        '201':
          description: Contacto registrado — queda pendiente de verificación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CONTACT_ALREADY_REGISTERED.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Agregar o corregir un método de contacto
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/documents/upload-url:
    post:
      description: >-
        Devuelve una URL prefirmada de un solo uso para subir un documento
        directamente al almacenamiento. El servidor IMPONE la ruta del objeto
        (`tenant/cliente/tipo/uuid`) y firma `Content-Type` y `Content-Length`:
        subir algo distinto a lo autorizado es rechazado por el almacenamiento.
        El `storageKey` devuelto es el que debe enviarse luego en el paquete de
        identidad.
      operationId: CustomerOnboardingProfileController_createUploadUrl
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentType:
                  type: string
                  enum:
                    - identity_front
                    - identity_back
                    - selfie
                    - proof_of_address
                    - other
                contentType:
                  type: string
                  enum:
                    - image/jpeg
                    - image/png
                    - application/pdf
                sizeBytes:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 15728640
              required:
                - documentType
                - contentType
                - sizeBytes
              additionalProperties: false
      responses:
        '201':
          description: >-
            Permiso de subida — `{ storageKey, uploadUrl, method,
            requiredHeaders, expiresAt }`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: PROFILE_NOT_EDITABLE_IN_STATUS o EVIDENCE_OBJECT_TOO_LARGE.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: DOCUMENT_STORAGE_NOT_CONFIGURED — no hay almacenamiento configurado.
      security:
        - access-token: []
      summary: Solicitar una URL de subida de documento
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/identity-verification:
    post:
      description: >-
        Consulta el registro estatal de identidad con los datos ya declarados y
        resuelve el expediente según lo que responda: `FOUND` sin observaciones
        ⇒ `verified` (y aprueba la evidencia documental); `NOT_FOUND` ⇒
        `rejected` y el cliente vuelve a `observed`; `PARTIAL_MATCH` o una caída
        del proveedor ⇒ queda `pending_review` para un analista. El número de
        documento se usa para consultar y NO se persiste; debe coincidir por
        hash con el ya declarado en el paquete de identidad.
      operationId: CustomerOnboardingProfileController_verifyIdentity
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                documentNumber:
                  type: string
                  minLength: 3
                  maxLength: 30
                documentComplement:
                  type: string
                  maxLength: 10
                scenario:
                  type: string
                  enum:
                    - happy_path
                    - random
                    - partial_match
                    - not_found
                    - provider_down
                    - data_not_available
              required:
                - documentNumber
              additionalProperties: false
      responses:
        '200':
          description: >-
            Resultado del proveedor, veredicto aplicado y elegibilidad
            resultante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: >-
            IDENTITY_PACKAGE_REQUIRED, IDENTITY_ALREADY_VERIFIED,
            DOCUMENT_NUMBER_MISMATCH o PROFILE_INCOMPLETE_FOR_VERIFICATION.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Verificar la identidad contra el registro externo
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/status:
    get:
      description: >-
        Devuelve el estado del cliente, el flujo vigente, el porcentaje de
        avance calculado en el SERVIDOR, el estado de cada sección con sus
        campos faltantes, los bloqueadores de habilitación y el `nextStep`. Es
        el endpoint que el frontend consulta al abrir la app para saber dónde
        retomar. El porcentaje no se calcula en el cliente a propósito: dos
        versiones de la app mostrarían avances distintos con los mismos datos.
      operationId: CustomerOnboardingStatusController_getStatus
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Estado, secciones, porcentaje de avance y próximo paso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El token no permite operar sobre este cliente.
        '404':
          description: Cliente no encontrado.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Estado y avance del onboarding
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/submit:
    post:
      description: >-
        Verifica que TODAS las secciones obligatorias estén completas, mueve al
        cliente a `under_review`, cierra el flujo de onboarding
        (`completion_status = completed`, `completed_at`) y dispara una
        evaluación de habilitación que puede promoverlo a `active`. Es el único
        punto del flujo donde se valida completitud.
      operationId: CustomerOnboardingStatusController_submitForReview
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                acknowledgement:
                  type: boolean
                  const: true
              required:
                - acknowledgement
              additionalProperties: false
      responses:
        '200':
          description: >-
            Paquete enviado — estado resultante, elegibilidad y bloqueadores
            vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: >-
            ONBOARDING_INCOMPLETE (con las secciones pendientes) o
            ONBOARDING_ALREADY_SUBMITTED.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Enviar el paquete de onboarding a revisión
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/observations:
    get:
      description: >-
        Lista lo que el cliente debe corregir para avanzar. NO expone las notas
        internas del analista, que pueden contener criterio de riesgo reservado.
      operationId: CustomerOnboardingStatusController_listObservations
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Observaciones, casos abiertos y bloqueadores vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Observaciones abiertas del cliente
      tags:
        - customer-onboarding
  /customer-onboarding/jobs/mark-abandoned:
    post:
      description: >-
        Cierra con `completion_status = abandoned` los flujos sin terminar cuya
        última actividad supera el umbral. Marca el FLUJO, no al cliente: quien
        dejó el registro a medias puede volver y retomar. Sin este cierre no
        existe tasa de abandono.
      operationId: CustomerOnboardingStatusController_markAbandoned
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                olderThanDays:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 365
                limit:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 2000
              additionalProperties: false
      responses:
        '200':
          description: Cantidad evaluada y marcada, con la fecha de corte aplicada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Marcar como abandonados los onboardings inactivos (job)
      tags:
        - customer-onboarding
  /operations/customers/{customerId}/identity-verification/decision:
    post:
      description: >-
        Aprueba o rechaza el expediente de identidad en bloque: el intento de
        verificación, el documento y todas sus evidencias pendientes. Aprobar NO
        habilita al cliente por sí solo — la habilitación sigue dependiendo de
        las quince condiciones de la regla, que se reevalúa y se registra en la
        misma transacción.
      operationId: CustomerVerificationController_decideIdentity
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                    - approve
                    - reject
                reasonCode:
                  type: string
                  minLength: 1
                  maxLength: 120
                notes:
                  type: string
                  maxLength: 2000
              required:
                - decision
                - reasonCode
              additionalProperties: false
      responses:
        '200':
          description: >-
            Decisión aplicada — incluye la elegibilidad resultante y sus
            bloqueadores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: IDENTITY_VERIFICATION_ATTEMPT_NOT_FOUND o cliente inexistente.
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Resolver la verificación de identidad del cliente
      tags:
        - customer-onboarding
  /operations/customers/{customerId}/compliance/screening:
    post:
      description: >-
        Coteja por HASH el nombre normalizado y los contactos primarios del
        cliente contra las entradas vigentes de `watchlist_entries` (del tenant
        y globales). Una coincidencia nueva bloquea la habilitación y lleva al
        cliente a `under_review`. Es idempotente: reejecutarlo no duplica
        coincidencias ya registradas.
      operationId: CustomerVerificationController_screen
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resultado del screening y elegibilidad resultante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Ejecutar el screening de listas restrictivas
      tags:
        - customer-onboarding
  /operations/customers/{customerId}/compliance/clear-matches:
    post:
      description: >-
        Cierra los falsos positivos de cumplimiento. Exige código de razón y
        nota: descartar una coincidencia sin motivo escrito es exactamente la
        decisión que después nadie puede defender. Exclusivo de cumplimiento y
        administración.
      operationId: CustomerVerificationController_clearMatches
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reasonCode:
                  type: string
                  minLength: 1
                  maxLength: 120
                notes:
                  type: string
                  minLength: 1
                  maxLength: 2000
              required:
                - reasonCode
                - notes
              additionalProperties: false
      responses:
        '200':
          description: Coincidencias descartadas y elegibilidad recalculada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Descartar las coincidencias de listas restrictivas
      tags:
        - customer-onboarding
  /customers/{customerId}/sessions/start:
    post:
      description: >-
        Abre una nueva sesión (login en la app móvil/web del cliente) asociada a
        un dispositivo. Un `customer` solo puede abrir sesiones para sí mismo
        (`assertOwnCustomerResource`); los roles internos pueden operar en
        nombre de cualquier cliente.
      operationId: CustomerSessionsController_startSession
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/IdempotencyKey'
