        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            minimum: 1
            maximum: 100
          description: >-
            Tamaño de página. El backend impone un máximo por endpoint; pedir
            más lo recorta en vez de fallar.
        - name: requesterUserId
          required: false
          in: query
          schema:
            type: string
            pattern: ^\d+$
          description: Filtra por el usuario interno que solicitó el cambio.
        - name: changeType
          required: false
          in: query
          schema:
            type: string
            maxLength: 30
            pattern: ^[A-Z_]+$
          description: >-
            Filtra por tipo de cambio de esquema propuesto (`create_table`,
            `add_column`, …).
        - name: approvalStatus
          required: false
          in: query
          schema:
            type: string
            enum:
              - pending
              - approved
              - rejected
          description: >-
            Filtra por estado de aprobación de la propuesta (`pending`,
            `approved`, `rejected`).
