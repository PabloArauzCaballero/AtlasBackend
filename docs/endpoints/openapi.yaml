  /operations/notifications/broadcast:
    post:
      description: >-
        Crea y entrega una notificación in-app real a customers y/o usuarios
        internos — a los ids indicados, o a todos los activos del tenant si no
        se indican. No usa email/SMS/push (esos canales siguen disponibles vía
        plantillas de eventos de dominio).
      operationId: NotificationsController_broadcastNotification
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 200
                body:
                  type: string
                  minLength: 1
                  maxLength: 2000
                priority:
                  default: 0
                  type: integer
                  minimum: 0
                  maximum: 100
                category:
                  default: custom_broadcast
                  type: string
                  minLength: 1
                  maxLength: 60
                icon:
                  anyOf:
                    - type: string
                      minLength: 1
                      maxLength: 60
                    - type: 'null'
                audience:
                  type: string
                  enum:
                    - customers
                    - internal_users
                    - both
                customerIds:
                  minItems: 1
                  maxItems: 5000
                  type: array
                  items:
                    type: string
                    pattern: ^[1-9][0-9]*$
                internalUserIds:
                  minItems: 1
                  maxItems: 5000
                  type: array
                  items:
                    type: string
                    pattern: ^[1-9][0-9]*$
              required:
                - title
                - body
                - priority
                - category
                - audience
              additionalProperties: false
      responses:
        '202':
          description: >-
            Broadcast aceptado — los mensajes se crearon (devuelve
            targeted/created) y la entrega corre en background (status:
            "queued"). Un broadcast grande no bloquea el request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          description: >-
            X-Idempotency-Key ausente, o customerIds/internalUserIds usado con
            la audience equivocada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Enviar notificación in-app personalizada (broadcast de admin)
      tags:
        - notifications
