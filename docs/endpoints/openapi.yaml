                        pattern: ^[a-zA-Z0-9_.:-]+$
                      retentionPolicyId:
                        type: string
                        pattern: ^[1-9][0-9]*$
                    required:
                      - tableName
                      - fieldName
                      - classificationCode
                      - storageMode
                    additionalProperties: false
                dataQualityRules:
                  default: []
                  maxItems: 500
                  type: array
                  items:
                    type: object
                    properties:
                      ruleCode:
                        type: string
                        minLength: 2
                        maxLength: 140
                        pattern: ^[a-zA-Z0-9_.:-]+$
                      ruleName:
                        type: string
                        minLength: 1
                        maxLength: 180
                      targetTable:
                        type: string
                        minLength: 2
                        maxLength: 120
                      targetField:
                        type: string
                        minLength: 2
                        maxLength: 120
                      severity:
                        type: string
                        minLength: 2
                        maxLength: 40
                      expressionJson:
                        type: object
                        propertyNames:
                          type: string
                        additionalProperties: {}
                      expectedAction:
                        type: string
                        minLength: 2
                        maxLength: 80
                      buildPhase:
                        type: string
                        minLength: 2
                        maxLength: 40
                    required:
                      - ruleCode
                      - ruleName
                      - targetTable
                      - severity
                      - expressionJson
                      - expectedAction
                    additionalProperties: false
              required:
                - privacyPurposes
                - retentionPolicies
                - dataProviders
                - classificationPolicies
                - sensitiveFieldRules
                - dataQualityRules
              additionalProperties: false
      responses:
        '200':
          description: Paquete de gobernanza de datos aplicado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Publicar un paquete de políticas de gobernanza de datos
      tags:
        - catalog-management
  /customer-onboarding/start:
    post:
      description: >-
        Crea el registro de cliente, sus credenciales (si se envió contraseña) y
        registra los consentimientos iniciales requeridos, todo en una única
        transacción. Endpoint público (sin token) — limitado a 10 intentos por
        minuto por IP para prevenir enumeración/abuso. Requiere consentimientos
        otorgados (`REQUIRED_CONSENT_MISSING` si falta alguno obligatorio).
      operationId: CustomerOnboardingController_startOnboarding
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  type: object
                  properties:
                    phone:
                      type: string
                      minLength: 6
                      maxLength: 40
                    email:
                      type: string
                      maxLength: 180
                      format: email
                      pattern: >-
                        ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                    firstName:
                      type: string
                      minLength: 1
                      maxLength: 120
                    lastName:
                      type: string
                      minLength: 1
                      maxLength: 120
                    birthDate:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                  additionalProperties: false
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
                consents:
                  minItems: 1
                  type: array
                  items:
                    type: object
                    properties:
                      consentDocumentId:
                        type: string
                        pattern: ^[1-9][0-9]*$
                      purposeCode:
                        type: string
                        minLength: 1
                        maxLength: 80
                      granted:
                        type: boolean
                      acceptedAt:
                        type: string
                        format: date-time
                        pattern: >-
                          ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                    required:
                      - consentDocumentId
                      - purposeCode
                      - granted
                    additionalProperties: false
                device:
                  type: object
                  properties:
                    deviceFingerprintHash:
                      type: string
                      minLength: 32
                      maxLength: 128
                    fingerprintVersion:
                      default: v1
                      type: string
                      minLength: 1
                      maxLength: 40
                    channel:
                      type: string
                      enum:
                        - mobile_app
                        - web_app
                    userAgent:
                      type: string
                      maxLength: 500
                    snapshot:
                      type: object
                      properties:
                        brand:
                          type: string
                          maxLength: 80
                        model:
                          type: string
                          maxLength: 120
                        osFamily:
                          type: string
                          maxLength: 40
                        osVersion:
                          type: string
                          maxLength: 60
                        appVersion:
                          type: string
                          maxLength: 60
                        isRooted:
                          type: boolean
                        isEmulator:
                          type: boolean
                        vpnDetected:
                          type: boolean
                        timezone:
                          type: string
                          maxLength: 60
                        locale:
                          type: string
                          maxLength: 20
                      additionalProperties: false
                  required:
                    - deviceFingerprintHash
                    - fingerprintVersion
                    - channel
                  additionalProperties: false
                permissions:
                  type: array
                  items:
                    type: object
                    properties:
                      permissionCode:
                        type: string
                        enum:
                          - location
                          - camera
                          - contacts
                          - notifications
                          - storage
                      granted:
                        type: boolean
                      decidedAt:
                        type: string
                        format: date-time
                        pattern: >-
                          ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                    required:
                      - permissionCode
                      - granted
                    additionalProperties: false
                onboarding:
                  type: object
                  properties:
                    sourceType:
                      default: mobile_app
                      type: string
                      minLength: 1
                      maxLength: 40
                    startedStepCode:
                      type: string
                      minLength: 1
                      maxLength: 80
                  required:
                    - sourceType
                  additionalProperties: false
              required:
                - customer
                - password
                - consents
                - device
              additionalProperties: false
      responses:
        '201':
          description: >-
            Cliente creado — devuelve el id del cliente y el estado inicial de
            onboarding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          description: x-tenant-id/x-idempotency-key ausente, o body inválido.
        '409':
          description: >-
            CUSTOMER_ALREADY_EXISTS — ya existe un cliente con el mismo
            teléfono/email en este tenant.
        '422':
          description: >-
            REQUIRED_CONSENT_MISSING — falta otorgar un consentimiento
            obligatorio.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Iniciar onboarding de un cliente nuevo
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/contact-verification/request:
    post:
      description: >-
        Envía un código de verificación (SMS/email, según el contacto) al método
        de contacto indicado del cliente.
      operationId: CustomerOnboardingController_requestContactVerification
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactType:
                  type: string
                  enum:
                    - phone
                    - email
                verificationChannel:
                  type: string
                  enum:
                    - sms
                    - email
                    - whatsapp
                sessionId:
                  type: string
                  pattern: ^[1-9][0-9]*$
              required:
                - contactType
                - verificationChannel
              additionalProperties: false
      responses:
        '202':
          description: Código de verificación enviado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El token no permite operar sobre este cliente.
        '404':
          description: Cliente no encontrado.
        '409':
          description: >-
            VERIFICATION_RATE_LIMITED — demasiados intentos recientes para este
            contacto.
        '422':
          description: >-
            CONTACT_NOT_REGISTERED — el contacto indicado no está registrado
            para este cliente.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Solicitar código de verificación de contacto (OTP)
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/contact-verification/submit:
    post:
      description: >-
        Valida el código recibido por SMS/email contra el intento de
        verificación pendiente más reciente.
      operationId: CustomerOnboardingController_submitContactVerification
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactType:
                  type: string
                  enum:
                    - phone
                    - email
                verificationChannel:
                  type: string
                  enum:
                    - sms
                    - email
                    - whatsapp
                verificationCode:
                  type: string
                  minLength: 4
                  maxLength: 12
                sessionId:
                  type: string
                  pattern: ^[1-9][0-9]*$
              required:
                - contactType
                - verificationChannel
                - verificationCode
              additionalProperties: false
      responses:
        '200':
          description: Contacto verificado correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: INVALID_VERIFICATION_CODE o VERIFICATION_CODE_EXPIRED.
        '403':
          description: El token no permite operar sobre este cliente.
        '404':
          description: >-
            VERIFICATION_ATTEMPT_NOT_FOUND — no hay un intento de verificación
            pendiente.
        '409':
          description: CONTACT_ALREADY_VERIFIED — el contacto ya estaba verificado.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Confirmar código de verificación de contacto (OTP)
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/identity-package:
    post:
      description: >-
        Registra los documentos de identidad y evidencia biométrica del cliente
        para su revisión/scoring de riesgo.
      operationId: CustomerOnboardingController_submitIdentityPackage
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identity:
                  type: object
                  properties:
                    documentType:
                      type: string
                      enum:
                        - ci
                        - passport
                        - foreign_id
                    documentNumberHash:
                      type: string
                      minLength: 32
                      maxLength: 128
                    documentNumber:
                      type: string
                      minLength: 3
                      maxLength: 30
                    documentLast4:
                      type: string
                      minLength: 2
                      maxLength: 4
                    countryCode:
                      default: BOL
                      type: string
                      minLength: 3
                      maxLength: 3
                    issuedIn:
                      type: string
                      maxLength: 60
                    issuedAt:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                    expiresAt:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                  required:
                    - documentType
                    - documentNumberHash
                    - documentLast4
                    - countryCode
                    - expiresAt
                  additionalProperties: false
                evidence:
                  minItems: 1
                  maxItems: 5
                  type: array
                  items:
                    type: object
                    properties:
                      evidenceType:
                        type: string
                        enum:
                          - identity_front
                          - identity_back
                          - selfie
                          - proof_of_address
                          - other
                      storageKey:
                        type: string
                        minLength: 8
                        maxLength: 500
                      mimeType:
                        type: string
                        enum:
                          - image/jpeg
                          - image/png
                          - application/pdf
                      sha256Hash:
                        type: string
                        minLength: 32
                        maxLength: 128
                      fileSizeBytes:
                        type: string
                        pattern: ^[1-9][0-9]*$
                    required:
                      - evidenceType
                      - storageKey
                      - mimeType
                      - sha256Hash
                    additionalProperties: false
                provider:
                  type: object
                  properties:
                    providerCode:
                      type: string
                      minLength: 1
                      maxLength: 80
                    requestPayloadHash:
                      type: string
                      minLength: 32
                      maxLength: 128
                  required:
                    - providerCode
                  additionalProperties: false
                sessionId:
                  type: string
                  pattern: ^[1-9][0-9]*$
              required:
                - identity
                - evidence
              additionalProperties: false
      responses:
        '202':
          description: Paquete de identidad recibido y encolado para procesamiento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El token no permite operar sobre este cliente.
        '404':
          description: Cliente no encontrado.
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: >-
            CUSTOMER_BLOCKED, REQUIRED_EVIDENCE_MISSING, o
            REQUIRED_CONSENT_MISSING.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Enviar paquete de identidad (documentos + selfie)
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/address-package:
    post:
      description: >-
        Registra la dirección declarada del cliente (y evidencia
        GPS/geolocalización cuando corresponda).
      operationId: CustomerOnboardingController_submitAddressPackage
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                address:
                  type: object
                  properties:
                    countryCode:
                      default: BOL
                      type: string
                      minLength: 3
                      maxLength: 3
                    department:
                      type: string
                      minLength: 1
                      maxLength: 80
                    city:
                      type: string
                      minLength: 1
                      maxLength: 120
                    zone:
                      type: string
                      maxLength: 120
                    addressLineEncrypted:
                      type: string
                      maxLength: 500
                    referenceEncrypted:
                      type: string
                      maxLength: 500
                  required:
                    - countryCode
                    - department
                    - city
                  additionalProperties: false
                gpsObservation:
                  type: object
                  properties:
                    lat:
                      type: number
                      minimum: -90
                      maximum: 90
                    lng:
                      type: number
                      minimum: -180
                      maximum: 180
                    accuracyMeters:
                      type: number
                      exclusiveMinimum: 0
                      maximum: 10000
                    capturedAt:
                      type: string
                      format: date-time
                      pattern: >-
                        ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                  required:
                    - lat
                    - lng
                  additionalProperties: false
                sessionId:
                  type: string
                  pattern: ^[1-9][0-9]*$
              required:
                - address
              additionalProperties: false
      responses:
        '200':
          description: Paquete de dirección registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El token no permite operar sobre este cliente.
        '404':
          description: Cliente no encontrado.
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: CUSTOMER_BLOCKED o REQUIRED_EVIDENCE_MISSING.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Enviar paquete de dirección
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/profile:
    patch:
      description: >-
        Persiste los campos enviados creando una versión nueva del perfil y
        cerrando la anterior. Acepta actualizaciones parciales: es la base del
        autoguardado por sección. Valida edad mínima y máxima cuando se envía
        `birthDate`.
      operationId: CustomerOnboardingProfileController_updateProfile
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  type: string
                  minLength: 1
                  maxLength: 120
                lastName:
                  type: string
                  minLength: 1
                  maxLength: 120
                birthDate:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                genderDeclared:
                  type: string
                  enum:
                    - female
                    - male
                    - other
                    - undisclosed
                preferredLanguage:
                  type: string
                  enum:
                    - es
                    - en
                    - qu
                    - ay
                marketingOptIn:
                  type: boolean
              additionalProperties: false
      responses:
        '200':
          description: Perfil actualizado — devuelve la versión vigente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: >-
            PROFILE_NOT_EDITABLE_IN_STATUS — el estado del cliente no admite
            edición.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Actualizar datos personales (guardado parcial)
      tags:
        - customer-onboarding
  /customer-onboarding/{customerId}/financial-profile:
    put:
      description: >-
