# Portal técnico de Atlas Backend.
#
#   yarn docs:serve   → servidor local con recarga
#   yarn docs:build   → build ESTRICTO: un enlace roto o una página huérfana hacen fallar el build
#
# `strict: true` es el punto entero de tener portal. Sin él, la documentación se degrada en silencio:
# alguien renombra un archivo, tres enlaces dejan de funcionar y nadie se entera hasta que un
# integrador se topa con un 404. Con él, ese renombrado rompe el PR.

site_name: Atlas Backend
site_description: >-
  Backend fintech Atlas: identidad, onboarding KYC, elegibilidad, crédito, riesgo y operaciones.
  Documentación técnica, contrato de API y runbooks de operación.
site_author: Equipo Backend Atlas
docs_dir: docs
site_dir: site

# `repo_url` alimenta el botón "editar esta página" (feature `content.action.edit`) y es la base que
# el hook de enlaces usa para apuntar al código.
repo_url: https://github.com/PabloArauzCaballero/AtlasBackend
repo_name: PabloArauzCaballero/AtlasBackend
edit_uri: edit/main/docs/


# Falla el build ante enlaces internos rotos, referencias a anclas inexistentes y avisos de
# navegación. Es lo que convierte la documentación en algo verificable.
strict: true

theme:
  name: material
  language: es
  icon:
    logo: material/bank-outline
    repo: fontawesome/brands/github
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Cambiar a modo oscuro
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Cambiar a modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  # Los diagramas se escriben como texto versionable y se compilan al renderizar: nada de imágenes
  # que nadie puede mantener.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search:
      lang: es

# La documentación enlaza código a propósito con rutas relativas (`../../src/...`), porque así se
# navegan desde GitHub y desde el IDE, que es donde más se leen. MkDocs las resuelve contra `docs/`
# y, al escaparse, no encontraría destino: con `strict: true` eso abortaría el build. El hook las
# traduce a URLs del repositorio SOLO al publicar, sin tocar la fuente ni relajar el gate.
hooks:
  - scripts/mkdocs/repo_links.py
  # `yarn docs:project` genera un README.md de inventario por carpeta. En el repositorio son útiles;
  # en el portal chocan con la página `index.md` curada de esa misma sección y, con `strict: true`,
  # el aviso aborta el build. El hook los descarta comprobando la condición real —"hay un index.md
  # al lado"— en vez de mantener a mano una lista que cada sección nueva volvería a romper.
  - scripts/mkdocs/generated_readmes.py

extra:
  # Rama contra la que el hook resuelve los enlaces a código.
  repo_ref: main
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PabloArauzCaballero/AtlasBackend

# MkDocs trata `README.md` como el índice de su carpeta, así que en las cinco carpetas que ya tienen
# un `index.md` escrito para el portal ambos compiten por la misma URL. Se excluye el README, no el
# index: el README lo genera `yarn docs:folders` para quien navega el repositorio en GitHub o en el
# IDE —donde sigue siendo útil— y el index es el que da contexto dentro del portal. Borrar el README
# rompería la navegación del repositorio para arreglar la del sitio.
exclude_docs: |
  api/README.md
  data/README.md
  getting-started/README.md
  operations/README.md
  reports/README.md

# La navegación es explícita, no automática. Una página que no aparece aquí es una página huérfana, y
# con `strict: true` el build lo dice.
nav:
  - Inicio: index.md

  - Empezar:
      - getting-started/index.md
      - Configuración local: getting-started/local-setup.md
