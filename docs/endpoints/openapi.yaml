      tags:
        - credit
  /customers/{customerId}/credit-applications:
    post:
      description: >-
        Valida el producto, el monto y el plazo, REEVALÚA la elegibilidad del
        cliente en el servidor y, solo si resulta elegible, crea la solicitud
        guardando la evaluación que la autorizó. Un cliente no elegible recibe
        `422 CUSTOMER_NOT_ELIGIBLE` con la lista de bloqueadores y no se
        persiste ninguna solicitud.
      operationId: CreditController_createApplication
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productId:
                  type: string
                  pattern: ^[1-9][0-9]*$
                requestedAmount:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 99999999
                requestedTermMonths:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 360
                purposeCode:
                  type: string
                  minLength: 1
                  maxLength: 80
              required:
                - productId
                - requestedAmount
                - requestedTermMonths
              additionalProperties: false
      responses:
        '201':
          description: Solicitud creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: CREDIT_PRODUCT_NOT_FOUND.
        '409':
          description: >-
            CREDIT_APPLICATION_ALREADY_OPEN — el cliente ya tiene una solicitud
            viva.
        '422':
          description: >-
            CUSTOMER_NOT_ELIGIBLE, CREDIT_PRODUCT_NOT_AVAILABLE,
            REQUESTED_AMOUNT_OUT_OF_RANGE o REQUESTED_TERM_OUT_OF_RANGE.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Crear una solicitud de crédito
      tags:
        - credit
    get:
      operationId: CreditController_listApplications
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - name: x-tenant-id
          in: header
          required: false
          schema:
            type: string
          description: >-
            Tenant sobre el que se opera. `TenantGuard` lo contrasta contra el
            `tenantId` del token y responde 403 si no coinciden, así que no es
            un selector libre.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Solicitudes del cliente, más recientes primero.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Listar las solicitudes del cliente
      tags:
        - credit
