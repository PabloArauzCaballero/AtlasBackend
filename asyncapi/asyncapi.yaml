operations:
  receiveKycLegal:
    action: receive
    channel:
      $ref: '#/channels/kycLegal'
    summary: Consumir los eventos emitidos de `kyc_legal`.
  receiveCustomerLifecycle:
    action: receive
    channel:
      $ref: '#/channels/customerLifecycle'
    summary: Consumir los eventos emitidos de `customer_lifecycle`.
  receiveCreditAdmission:
    action: receive
    channel:
      $ref: '#/channels/creditAdmission'
    summary: Consumir los eventos emitidos de `credit_admission`.
  receivePayments:
    action: receive
    channel:
      $ref: '#/channels/payments'
    summary: Consumir los eventos emitidos de `payments`.
  receiveSupportServiceManagement:
    action: receive
    channel:
      $ref: '#/channels/supportServiceManagement'
    summary: Consumir los eventos emitidos de `support_service_management`.
components:
  schemas:
    OutboxEvent:
      type: object
      description: Fila de `outbox_events` (columnas comprobadas contra `src/database/models/outbox-events.model.ts`).
      required:
        - event_id
        - event_code
        - schema_version
        - aggregate_type
        - status
        - _created_at
      properties:
        event_id:
          type: string
          format: uuid
          description: Identificador único del evento.
        event_code:
          type: string
          description: Código del registro (`EVENT_REGISTRY`).
        event_family:
          type:
            - string
            - 'null'
          description: Familia del registro.
        event_version:
          type:
            - integer
            - 'null'
          description: Versión del código en el registro.
        schema_version:
          type: integer
          description: Versión del esquema del payload.
        aggregate_type:
          type: string
          description: Tipo de la entidad afectada.
        aggregate_id:
          type:
            - string
            - 'null'
          description: Identificador de la entidad afectada.
        aggregate_version:
          type:
            - string
            - 'null'
          description: 'Versión monótona del agregado (P-08): un consumidor que ya aplicó la N descarta la N-1 que llegue tarde.'
        _tenant_id:
          type:
            - string
            - 'null'
          description: Tenant. `null` en eventos de plataforma.
        event_payload_json:
          type:
            - object
            - 'null'
          description: Carga del evento. Sin PII en claro.
        metadata_json:
          type:
            - object
            - 'null'
          description: Metadatos de origen.
        correlation_id:
          type:
            - string
            - 'null'
          description: Enlaza el evento con la petición que lo originó.
        causation_id:
          type:
            - string
            - 'null'
          description: Evento que causó éste.
        idempotency_key:
          type:
            - string
            - 'null'
          description: Clave de deduplicación del productor.
        producer:
          type:
            - string
            - 'null'
          description: Contexto que escribió el evento.
        priority:
          type:
            - integer
            - 'null'
          description: Menor valor = se despacha antes dentro del lote.
        status:
          type: string
          enum:
            - pending
            - processing
            - processed
            - failed
            - cancelled
          description: Estado.
        _created_at:
          type: string
          format: date-time
          description: Momento en que se escribió.
