  /customers/{customerId}/me:
    get:
      description: >-
        Devuelve el perfil vigente del cliente: datos de identidad, contactos,
        consentimientos otorgados y el último resultado de riesgo reducido
        (decisión + nivel, sin el desglose completo del modelo). Un `customer`
        solo puede leer su propio perfil (`assertOwnCustomerResource`); los
        roles internos listados pueden leer el de cualquier cliente del tenant.
      operationId: CustomersController_getCustomerMe
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: Id numérico del cliente.
        - name: x-tenant-id
          in: header
          description: >-
            Opcional para `customer` (se toma del token); requerido para roles
            internos.
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Perfil del cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          description: x-tenant-id ausente o no es un entero positivo válido.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Un actor con rol customer intentó leer el perfil de otro cliente.
        '404':
          description: Cliente no encontrado.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Perfil resumido del cliente ("mi perfil")
      tags:
        - customers
  /customers/{customerId}/eligibility:
    get:
      description: >-
        Evalúa la regla de habilitación y devuelve `{ eligible, blockers[],
        sections[], completionPercentage, nextStep }`. Cada consulta deja una
        fila de evidencia en `customer_eligibility_evaluations` con la versión
        de la regla aplicada. Un `customer` solo puede consultar su propia
        habilitación.
      operationId: CustomerEligibilityController_getEligibility
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - name: x-tenant-id
          in: header
          description: Opcional para `customer` (se toma del token).
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Resultado de la evaluación, con la lista completa de bloqueadores.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Un customer intentó consultar la habilitación de otro cliente.
        '404':
          description: Cliente no encontrado.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Habilitación crediticia del cliente
      tags:
        - customer-eligibility
  /operations/customers/{customerId}/eligibility/decision:
    post:
      description: >-
        Aprueba, rechaza, observa, suspende o reincorpora a un cliente. La
        transición se valida contra la máquina de estados y se escribe junto a
        su evento de historial en la misma transacción. Aprobar con bloqueadores
        pendientes se registra como excepción autorizada (`decision_source =
        manual_override`), con la lista de bloqueadores omitidos.
      operationId: CustomerEligibilityController_decideEligibility
      parameters:
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                    - approve
                    - reject
                    - observe
                    - suspend
                    - reinstate
                reasonCode:
                  type: string
                  minLength: 1
                  maxLength: 120
                notes:
                  type: string
                  maxLength: 2000
              required:
                - decision
                - reasonCode
              additionalProperties: false
      responses:
        '200':
          description: >-
            Decisión aplicada — estado anterior, estado nuevo y bloqueadores
            vigentes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Cliente no encontrado.
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: >-
            INVALID_STATUS_TRANSITION — la máquina de estados no permite esa
            transición.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Decidir la habilitación de un cliente (operaciones)
      tags:
        - customer-eligibility
