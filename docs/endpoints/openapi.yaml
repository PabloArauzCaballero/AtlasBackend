                      - FINANCE_MANAGER
                      - MERCHANT_OPERATIONS
                      - DATA_GOVERNANCE_MANAGER
                      - DATA_QUALITY_ANALYST
                      - QA_ENGINEER
                      - AUDITOR_READONLY
                      - SUPPORT_AGENT
                      - EXECUTIVE_READONLY
                reason:
                  type: string
                  minLength: 8
                  maxLength: 500
              required:
                - roles
                - reason
              additionalProperties: false
      responses:
        '200':
          description: Roles reemplazados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: INTERNAL_USER_NOT_FOUND.
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Reemplazar roles de usuario interno
      tags:
        - internal-users
  /internal/roles:
    get:
      operationId: InternalAccessCatalogController_listRoles
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Lista de roles internos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Listar roles internos
      tags:
        - internal-access-catalog
  /internal/roles/{roleId}:
    get:
      operationId: InternalAccessCatalogController_getRole
      parameters:
        - name: roleId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador de ruta `roleId` del recurso direccionado por la
            operación.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Detalle del rol (con permisos asociados).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: INTERNAL_ROLE_NOT_FOUND.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Consultar rol interno
      tags:
        - internal-access-catalog
  /internal/permissions:
    get:
      operationId: InternalAccessCatalogController_listPermissions
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Lista de permisos internos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Listar permisos internos
      tags:
        - internal-access-catalog
  /auth/login:
    post:
      description: >-
        Autentica a un `customer`, `internal_user` o `platform_user` y emite un
        access+refresh token. El identificador de login depende de `actorType`:
        para `customer` es el mismo teléfono/email usado en onboarding; para
        `internal_user`/`platform_user` es el email corporativo. Bloquea
        temporalmente tras `AUTH_MAX_FAILED_LOGIN_ATTEMPTS` intentos fallidos
        consecutivos (`AUTH_LOCKOUT_MINUTES`).
      operationId: AuthController_login
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actorType:
                  type: string
                  enum:
                    - customer
                    - internal_user
                    - platform_user
                identifier:
                  type: string
                  minLength: 3
                  maxLength: 180
                password:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - actorType
                - identifier
                - password
              additionalProperties: false
      responses:
        '200':
          description: >-
            Login exitoso — access token + refresh token. Para super admins
            (roles admin/platform_admin) con MailSender configurado, responde en
            cambio `{ pinChallengeRequired, challengeToken, expiresInMinutes }`:
            completar con POST /auth/login/pin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          description: x-tenant-id ausente o no es un entero positivo válido.
        '401':
          description: >-
            Credenciales inválidas, o cuenta bloqueada temporalmente por
            intentos fallidos.
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Login
      tags:
        - auth
  /auth/login/pin:
    post:
      description: >-
        Segundo paso del login para super admins (roles admin/platform_admin)
        cuando MailSender está configurado: canjea el `challengeToken` devuelto
        por `POST /auth/login` más el PIN de 6 dígitos recibido por correo por
        el par access+refresh token definitivo.
      operationId: AuthController_verifyLoginPin
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeToken:
                  type: string
                  minLength: 20
                pin:
                  type: string
                  pattern: ^\d{6}$
              required:
                - challengeToken
                - pin
              additionalProperties: false
      responses:
        '200':
          description: PIN correcto — access token + refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            PIN inválido, expirado, agotó intentos, o el actor ya no está
            disponible.
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Verificar PIN de login
      tags:
        - auth
  /auth/password-reset/request:
    post:
      description: >-
        Envía por correo (MailSender) un código de un solo uso para restablecer
        la contraseña. La respuesta es idéntica exista o no la cuenta, para no
        permitir enumeración.
      operationId: AuthController_requestPasswordReset
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actorType:
                  type: string
                  enum:
                    - customer
                    - internal_user
                    - platform_user
                identifier:
                  type: string
                  maxLength: 180
                  format: email
                  pattern: >-
                    ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
              required:
                - actorType
                - identifier
              additionalProperties: false
      responses:
        '200':
          description: >-
            Solicitud registrada (si la cuenta existe, el código fue enviado por
            correo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: El servicio de correo (MailSender) no está configurado.
      security: []
      summary: Solicitar cambio de contraseña
      tags:
        - auth
  /auth/password-reset/confirm:
    post:
      description: >-
        Fija la contraseña nueva usando el código recibido por correo. Al
        confirmarse, revoca todos los refresh tokens del actor e invalida los
        access tokens vigentes (tokenVersion).
      operationId: AuthController_confirmPasswordReset
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actorType:
                  type: string
                  enum:
                    - customer
                    - internal_user
                    - platform_user
                identifier:
                  type: string
                  maxLength: 180
                  format: email
                  pattern: >-
                    ^(?!\.)(?!.*\.\.)([A-Za-z0-9_'+\-\.]*)[A-Za-z0-9_+-]@([A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
                code:
                  type: string
                  pattern: ^\d{6}$
                newPassword:
                  type: string
                  minLength: 10
                  maxLength: 128
              required:
                - actorType
                - identifier
                - code
                - newPassword
              additionalProperties: false
      responses:
        '200':
          description: >-
            Contraseña actualizada; todas las sesiones previas quedaron
            revocadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            Código inválido/expirado o la contraseña nueva no cumple el mínimo
            de seguridad.
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Confirmar cambio de contraseña
      tags:
        - auth
  /auth/refresh:
    post:
      description: >-
        Rota un refresh token vigente por un nuevo access+refresh token
        (rotación en cada uso — el refresh token anterior queda revocado).
      operationId: AuthController_refresh
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 20
              required:
                - refreshToken
              additionalProperties: false
      responses:
        '200':
          description: Rotación exitosa — nuevo access token + refresh token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            Refresh token inválido, expirado, o el actor asociado ya no está
            disponible.
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Refresh
      tags:
        - auth
  /auth/logout:
    post:
      description: >-
        Revoca un refresh token (o todos los refresh tokens vigentes del mismo
        actor, si `allDevices=true`). Idempotente: revocar un token ya revocado
        no falla.
      operationId: AuthController_logout
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  minLength: 20
                allDevices:
                  default: false
                  type: boolean
              required:
                - refreshToken
                - allDevices
              additionalProperties: false
      responses:
        '200':
          description: >-
            Logout procesado (siempre, incluso si el token ya estaba revocado o
            no existía).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Logout
      tags:
        - auth
  /auth/me:
    get:
      description: >-
        Devuelve el tipo de actor, su rol, su tenant y —para un cliente— su
        `customerId`. Es la forma soportada de que el frontend conozca su propio
        identificador sin decodificar el access token.
      operationId: AuthController_getMe
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Identidad del actor del token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Token ausente, inválido o revocado.
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Identidad del actor autenticado
      tags:
        - auth
  /auth/mfa:
    post:
      description: >-
        Un cliente autenticado activa o desactiva su segundo factor (OTP por
        correo). Con MFA activo, su próximo login responde `{
        pinChallengeRequired, challengeToken, expiresInMinutes }` y debe
        completarse con POST /auth/login/pin. Activar exige que MailSender esté
        configurado (si no, no habría cómo entregar el OTP).
      operationId: AuthController_setMfaPreference
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled:
                  type: boolean
              required:
                - enabled
              additionalProperties: false
      responses:
        '200':
          description: Preferencia de MFA actualizada — `{ mfaEnabled }`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El actor autenticado no es un cliente.
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: >-
            Se intentó activar MFA pero el servicio de correo no está
            configurado.
      security:
        - access-token: []
      summary: Activar/desactivar MFA (cliente)
      tags:
        - auth
  /auth/provision-credentials:
    post:
      description: >-
        Crea la contraseña inicial de un `internal_user` o `platform_user` ya
        existente (creado por seed/migración, sin credenciales todavía).
        Requiere un access token vigente con rol `admin` o `platform_admin` —
        verificado tanto por el guard de roles como, en defensa en profundidad,
        dentro del propio `AuthService`.
      operationId: AuthController_provisionCredentials
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                actorType:
                  type: string
                  enum:
                    - internal_user
                    - platform_user
                actorId:
                  type: string
                  pattern: ^[1-9][0-9]*$
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
              required:
                - actorType
                - actorId
                - password
              additionalProperties: false
      responses:
        '201':
          description: Credenciales provisionadas correctamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            La contraseña no cumple el mínimo de seguridad requerido, o el actor
            indicado no existe.
        '403':
          description: El actor autenticado no tiene rol admin/platform_admin.
        '409':
          description: >-
            CREDENTIALS_ALREADY_PROVISIONED — el actor ya tiene contraseña
            configurada.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Provisionar credenciales
      tags:
        - auth
  /health:
    get:
      description: >-
        Verifica conectividad a la base de datos y reporta uptime/versión. No
        requiere autenticación.
      operationId: HealthController_check
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Servicio saludable o degradado (nunca falla por sí mismo).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Health check del servicio (público, sin auth)
      tags:
        - health
  /health/liveness:
    get:
      description: >-
        Trivial: si responde, el event loop atiende peticiones. No verifica
        dependencias.
      operationId: HealthController_liveness
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: El proceso está vivo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      summary: Liveness probe (¿el proceso está vivo?)
      tags:
        - health
  /health/readiness:
    get:
      description: >-
        Verifica Postgres (obligatorio) y Redis (si está configurado). Devuelve
        503 si Postgres no responde, para que el balanceador/orquestador saque
        la instancia del pool. Redis no configurado (dev) no falla.
      operationId: HealthController_readiness
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Listo para recibir tráfico.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: 'No listo: una dependencia obligatoria no responde.'
      security: []
      summary: Readiness probe (¿puede atender tráfico?)
      tags:
        - health
  /operations/catalogs:
    get:
      description: >-
        Devuelve los catálogos que normalizan señales de negocio y su versión
        más reciente.
      operationId: CatalogManagementController_listCatalogs
      parameters:
        - name: active
          required: false
          in: query
          schema:
            default: all
            type: string
            enum:
              - 'true'
              - 'false'
              - all
          description: Restringe a los registros vigentes cuando es `true`.
        - name: status
          required: false
          in: query
          schema:
            default: all
            type: string
            enum:
              - draft
              - pending_approval
              - approved
              - published
              - retired
              - all
          description: >-
            Filtra por estado del recurso. Los valores admitidos son los del
            dominio de ese recurso.
        - name: domain
          required: false
          in: query
          schema:
            type: string
            minLength: 2
            maxLength: 80
          description: Filtra por dominio de negocio del catálogo técnico.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Lista de catálogos y su versión vigente o más reciente.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                              description: >-
                                Catálogo de contexto usado para normalizar
                                señales antes de una evaluación del motor de
                                decisión.
                              properties:
                                catalogId:
                                  type: string
                                  pattern: ^[1-9][0-9]*$
                                catalogCode:
                                  type: string
                                catalogName:
                                  type: string
                                domain:
                                  type:
                                    - string
                                    - 'null'
                                description:
                                  type:
                                    - string
                                    - 'null'
                                ownerTeam:
                                  type:
                                    - string
                                    - 'null'
                                isActive:
                                  type: boolean
                                currentVersion:
                                  type:
                                    - object
                                    - 'null'
                                  properties:
                                    catalogVersionId:
                                      type: string
                                      pattern: ^[1-9][0-9]*$
                                    versionCode:
                                      type: string
                                    status:
                                      type: string
                                      enum:
                                        - draft
                                        - pending_approval
                                        - approved
                                        - published
                                        - retired
                                        - rejected
                                    validFrom:
                                      type:
                                        - string
                                        - 'null'
                                      format: date
                                    validUntil:
                                      type:
                                        - string
                                        - 'null'
                                      format: date
                                  required:
                                    - catalogVersionId
                                    - versionCode
                                    - status
                                    - validFrom
                                    - validUntil
                              required:
                                - catalogId
                                - catalogCode
                                - catalogName
                                - domain
                                - description
                                - ownerTeam
                                - isActive
                                - currentVersion
                        required:
                          - items
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Listar catálogos de contexto del motor de decisión
      tags:
        - catalog-management
  /operations/catalogs/{catalogCode}/versions/{versionId}:
    get:
      operationId: CatalogManagementController_getCatalogVersion
      parameters:
        - name: versionId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: Identificador de la versión del catálogo.
        - name: catalogCode
          required: true
          in: path
          schema:
            type: string
            minLength: 2
            maxLength: 140
            pattern: ^[a-zA-Z0-9_.:-]+$
          description: Código del catálogo de contexto.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Versión, items, alias y mapeos de riesgo del catálogo.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          catalog:
                            type: object
                            description: >-
                              Catálogo de contexto usado para normalizar señales
                              antes de una evaluación del motor de decisión.
                            properties:
                              catalogId:
                                type: string
                                pattern: ^[1-9][0-9]*$
                              catalogCode:
