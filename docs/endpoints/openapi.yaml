                  required:
                    - lat
                    - lng
                  additionalProperties: false
                permissions:
                  default: []
                  maxItems: 30
                  type: array
                  items:
                    type: object
                    properties:
                      permissionCode:
                        type: string
                        minLength: 1
                        maxLength: 80
                      granted:
                        type: boolean
                      decidedAt:
                        type: string
                        format: date-time
                        pattern: >-
                          ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                    required:
                      - permissionCode
                      - granted
                    additionalProperties: false
                locationPermissionGranted:
                  type: boolean
                simObservation:
                  type: object
                  properties:
                    phoneNumberHash:
                      type: string
                      maxLength: 128
                    phoneLast4:
                      type: string
                      pattern: ^[0-9]{4}$
                    carrierName:
                      type: string
                      maxLength: 80
                    simType:
                      type: string
                      maxLength: 40
                    simCount:
                      type: integer
                      minimum: 0
                      maximum: 10
                  additionalProperties: false
                ipReputation:
                  type: object
                  properties:
                    isVpn:
                      type: boolean
                    isProxy:
                      type: boolean
                    isTor:
                      type: boolean
                    countryCode:
                      type: string
                      minLength: 2
                      maxLength: 2
                    city:
                      type: string
                      maxLength: 120
                    reputationScore:
                      type: number
                      minimum: 0
                      maximum: 1
                  additionalProperties: false
              required:
                - device
                - authMethod
                - permissions
              additionalProperties: false
      responses:
        '201':
          description: Sesión creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          description: X-Idempotency-Key ausente, o x-tenant-id inválido.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: El dispositivo no está vinculado al cliente.
