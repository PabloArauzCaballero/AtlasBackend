  /systems/logs/mongo:
    get:
      operationId: MongoLogsController_listMongoLogs
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            default: 50
            type: integer
            exclusiveMinimum: 0
            maximum: 200
          description: >-
            Tamaño de página. El backend impone un máximo por endpoint; pedir
            más lo recorta en vez de fallar.
        - name: page
          required: false
          in: query
          schema:
            default: 1
            type: integer
            exclusiveMinimum: 0
            maximum: 9007199254740991
          description: Página solicitada, empezando en 1.
        - name: to
          required: false
          in: query
          schema:
            type: string
            format: date-time
            pattern: >-
              ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: Fin del rango temporal (ISO-8601, UTC). Exclusivo.
        - name: from
          required: false
          in: query
          schema:
            type: string
            format: date-time
            pattern: >-
              ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
          description: Inicio del rango temporal (ISO-8601, UTC). Inclusivo.
        - name: q
          required: false
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 200
          description: >-
            Texto de búsqueda libre. Se compara de forma insensible a mayúsculas
            sobre los campos indexados del recurso.
        - name: service
          required: false
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 120
          description: Filtra por servicio backend que originó el registro.
        - name: type
          required: false
          in: query
          schema:
            type: string
            enum:
              - startup
              - append
              - rotation
          description: Filtra por tipo del recurso dentro de su catálogo.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Lista paginada de logs desde MongoDB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          description: MONGO_LOGS_NOT_CONFIGURED.
      security:
        - access-token: []
      summary: Listar logs sincronizados a MongoDB (Archivo.log remoto)
      tags:
        - systems-ops
  /workflows:
    get:
      description: >-
        Devuelve una fila por versión de flujo. `moduleCode` y `role` filtran
        por lo que el flujo contiene, no por atributos de la cabecera: un flujo
        aparece si alguna de sus etapas pertenece al módulo o si alguno de sus
        pasos autoriza al rol.
      operationId: WorkflowCatalogController_list
      parameters:
        - name: includeDeprecated
          required: false
          in: query
          schema: {}
          description: >-
            Incluye también las versiones retiradas del catálogo. Por omisión se
            omiten.
        - name: role
          required: false
          in: query
          schema: {}
          description: Filtra por rol autorizado del sistema de autorización.
        - name: moduleCode
          required: false
          in: query
          schema: {}
          description: Filtra por módulo funcional del backend.
        - name: ownerDomain
          required: false
          in: query
          schema: {}
          description: Filtra por dominio de negocio propietario del recurso.
        - name: processType
          required: false
          in: query
          schema: {}
          description: >-
            Filtra por familia del proceso (`customer_journey`, `back_office`,
            `system_job`, `integration`).
        - name: status
          required: false
          in: query
          schema: {}
          description: >-
            Filtra por estado del recurso. Los valores admitidos son los del
            dominio de ese recurso.
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Flujos registrados, ordenados por código y versión descendente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Listar los flujos de trabajo registrados
      tags:
        - workflow-catalog
  /workflows/{workflowCode}/versions:
    get:
      operationId: WorkflowCatalogController_listVersions
      parameters:
        - name: workflowCode
          required: true
          in: path
          schema:
            type: string
            minLength: 2
            maxLength: 80
            pattern: ^[a-z][a-z0-9_]*$
          description: >-
            Código del flujo de trabajo en `snake_case`
            (`customer_credit_journey`).
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Versiones del flujo, de la más reciente a la más antigua.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: WORKFLOW_NOT_FOUND.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Versiones registradas de un flujo
      tags:
        - workflow-catalog
  /workflows/{workflowCode}:
    get:
      description: >-
        Etapas anidadas con sus subetapas y pasos, más las transiciones y
        dependencias. `version=latest` (por defecto) resuelve la versión marcada
        como predeterminada y, si no hay ninguna, la activa más reciente.
      operationId: WorkflowCatalogController_getTree
      parameters:
        - name: actorType
          required: false
          in: query
          schema: {}
          description: >-
            Filtra por tipo de actor que originó el registro (`customer`,
            `internal_user`, `system`).
        - name: lifecycleStatus
          required: false
          in: query
          schema: {}
          description: >-
            Filtra por estado del ciclo de vida del cliente (`registered`,
            `under_review`, `active`, …).
        - name: role
          required: false
          in: query
          schema: {}
          description: Filtra por rol autorizado del sistema de autorización.
        - name: moduleCode
          required: false
          in: query
          schema: {}
          description: Filtra por módulo funcional del backend.
        - name: version
          required: false
          in: query
          description: '`latest` o una versión concreta (`v1`).'
          schema: {}
        - name: workflowCode
          required: true
          in: path
          schema:
            type: string
            minLength: 2
            maxLength: 80
            pattern: ^[a-z][a-z0-9_]*$
          description: >-
            Código del flujo de trabajo en `snake_case`
            (`customer_credit_journey`).
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: >-
            Árbol del flujo con totales de etapas, pasos, transiciones y
            dependencias.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: WORKFLOW_NOT_FOUND.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Árbol completo de un flujo
      tags:
        - workflow-catalog
  /workflows/{workflowCode}/stages:
    get:
      description: >-
        Versión aplanada del árbol con `depth`, para pintar un recorrido lineal
        sin recorrer la jerarquía.
      operationId: WorkflowCatalogController_listStages
      parameters:
        - name: workflowCode
          required: true
          in: path
          schema:
            type: string
            minLength: 2
            maxLength: 80
            pattern: ^[a-z][a-z0-9_]*$
          description: >-
            Código del flujo de trabajo en `snake_case`
            (`customer_credit_journey`).
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Etapas ordenadas, con sus pasos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Etapas del flujo en orden de ejecución
      tags:
        - workflow-catalog
  /workflows/{workflowCode}/transitions:
    get:
      operationId: WorkflowCatalogController_listTransitions
      parameters:
        - name: workflowCode
          required: true
          in: path
          schema:
            type: string
            minLength: 2
            maxLength: 80
            pattern: ^[a-z][a-z0-9_]*$
          description: >-
            Código del flujo de trabajo en `snake_case`
            (`customer_credit_journey`).
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Transiciones con su condición, origen y destino.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Transiciones declaradas del flujo
      tags:
        - workflow-catalog
  /workflows/{workflowCode}/graph:
    get:
      description: >-
        Nodos (etapas y pasos) y aristas (transiciones y dependencias) listos
        para una librería de diagramas.
      operationId: WorkflowCatalogController_getGraph
      parameters:
        - name: workflowCode
          required: true
          in: path
          schema:
            type: string
            minLength: 2
            maxLength: 80
            pattern: ^[a-z][a-z0-9_]*$
          description: >-
            Código del flujo de trabajo en `snake_case`
            (`customer_credit_journey`).
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Grafo del flujo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Representación de grafo para visualización
      tags:
        - workflow-catalog
  /workflows/{workflowCode}/transitions/validate:
    post:
      description: >-
        Comprueba el grafo declarado: que la transición exista, que las
        dependencias obligatorias estén cubiertas y que rol y estado encajen con
        el paso destino. NO sustituye a los guards ni a las reglas del servicio
        real, que se siguen aplicando al ejecutar el endpoint.
      operationId: WorkflowCatalogController_validateTransition
      parameters:
        - name: workflowCode
          required: true
          in: path
          schema:
            type: string
            minLength: 2
            maxLength: 80
            pattern: ^[a-z][a-z0-9_]*$
          description: >-
            Código del flujo de trabajo en `snake_case`
            (`customer_credit_journey`).
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  default: latest
                  type: string
                  minLength: 1
                  maxLength: 20
                  pattern: ^(latest|v[0-9]+(?:\.[0-9]+)?)$
                fromStepCode:
                  type: string
                  minLength: 1
                  maxLength: 120
                toStepCode:
                  type: string
                  minLength: 1
                  maxLength: 120
                role:
                  type: string
                  minLength: 1
                  maxLength: 60
                lifecycleStatus:
                  type: string
                  minLength: 1
                  maxLength: 40
                completedStepCodes:
                  default: []
                  maxItems: 200
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 120
              required:
                - version
                - toStepCode
                - completedStepCodes
              additionalProperties: false
      responses:
        '200':
          description: Resultado con `allowed` y un `reasonCode` explícito.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: WORKFLOW_NOT_FOUND.
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Validar si una transición está permitida
      tags:
        - workflow-catalog
  /customers/{customerId}/workflow-progress:
    get:
      description: >-
        Devuelve etapas completadas, pendientes y bloqueadas, el porcentaje de
        avance y el siguiente paso válido (método, ruta y roles). Un `customer`
        solo puede consultar su propio avance.
      operationId: WorkflowProgressController_getProgress
      parameters:
        - name: version
          required: false
          in: query
          description: '`latest` o una versión concreta (`v1`).'
          schema: {}
        - name: workflowCode
          required: false
          in: query
          description: Por defecto, el recorrido estándar del cliente.
          schema: {}
        - name: customerId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: >-
            Identificador del cliente. Un actor con rol `customer` sólo puede
            operar sobre el suyo.
        - name: x-tenant-id
          in: header
          description: Opcional para `customer` (se toma del token).
          required: false
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Avance del cliente, con la siguiente llamada a realizar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Un customer intentó consultar el avance de otro cliente.
        '404':
          description: WORKFLOW_NOT_FOUND o cliente no encontrado.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Avance del cliente dentro del flujo estándar
      tags:
        - workflow-catalog
  /operations/workflows/{workflowCode}/consistency:
    get:
      description: >-
        Compara cada paso sembrado con las rutas que ESTE proceso tiene
        montadas: ruta inexistente, código de endpoint incoherente, estado de
        ciclo de vida desconocido (errores); roles divergentes, endpoint aún no
        descubierto y rutas del mismo dominio sin mapear (avisos). `status` es
        `drift_detected` si hay al menos un error.
      operationId: WorkflowOperationsController_checkConsistency
      parameters:
        - name: version
          required: false
          in: query
          description: '`latest` o una versión concreta (`v1`).'
          schema: {}
        - name: workflowCode
          required: true
          in: path
          schema:
            type: string
            minLength: 2
            maxLength: 80
            pattern: ^[a-z][a-z0-9_]*$
          description: >-
            Código del flujo de trabajo en `snake_case`
            (`customer_credit_journey`).
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Informe de consistencia con la lista completa de hallazgos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: WORKFLOW_NOT_FOUND.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Informe de consistencia del flujo contra los endpoints reales
      tags:
        - workflow-catalog
info:
  title: Atlas API
  description: >-
    API de Proyecto Atlas: identidad de cliente, autenticación, sesiones,
    consentimientos, privacidad, telemetría, riesgo/scoring, onboarding,
    elegibilidad crediticia y plataforma administrativa. Incluye catálogos
    versionados, definiciones semánticas y glosario de negocio para dar contexto
    trazable al motor de decisión. El dominio de crédito cubre el catálogo de
    productos y el ciclo de solicitud y decisión; compras, cuotas y comercios
    permanecen fuera del alcance actual.
  version: 0.3.0
  contact:
    name: Equipo Backend Atlas
    url: https://github.com/PabloArauzCaballero/AtlasBackend
    email: backend@atlas.local
  license:
    name: UNLICENSED
    url: https://github.com/PabloArauzCaballero/AtlasBackend
tags:
  - name: auth
    description: >-
      Autenticación: login, verificación por PIN, refresh, logout y recuperación
      de contraseña.
  - name: sessions
    description: Sesiones activas del cliente, dispositivos asociados y cierre remoto.
  - name: customer-onboarding
    description: >-
      Alta y captura de datos del solicitante en seis secciones (contacto,
      personales, perfil financiero, domicilio, documentos, referencias) hasta
      el envío del paquete.
  - name: customers
    description: >-
      Datos del cliente, su estado en la máquina de estados y su ficha
      consolidada.
  - name: customer-eligibility
    description: >-
      Elegibilidad crediticia. No responde sí/no: devuelve los BLOQUEADORES
      nombrados que impiden avanzar, y persiste la evidencia del cálculo.
  - name: consents
    description: Documentos de consentimiento vigentes y aceptaciones del titular.
  - name: customer-privacy
    description: >-
      Derechos del titular: consentimientos de tratamiento, retención y
      solicitudes de privacidad.
  - name: customer-telemetry
    description: Señales de comportamiento y dispositivo capturadas durante el recorrido.
  - name: credit
    description: >-
      Catálogo de productos de crédito, solicitudes y su ciclo hasta la
      decisión.
  - name: risk
    description: >-
      Evaluación de riesgo versionada y explicable, con las features y el
      ruleset usados en cada decisión.
  - name: external-data
    description: >-
      Orquestación de consultas a proveedores externos, con consentimiento,
      coste, caché e idempotencia.
  - name: kyc
    description: Verificación de identidad contra fuentes autoritativas.
  - name: bureau
    description: >-
      Consulta a buró crediticio. Proveedor costoso: bloqueado por política
      salvo aprobación explícita.
  - name: telco
    description: >-
      Señales de operadora móvil: antigüedad de línea, actividad y cambio de
      SIM.
  - name: social
    description: >-
      Señales sociales por OAuth voluntario. Sin scraping ni credenciales de
      terceros.
  - name: whatsapp
    description: Contactabilidad y códigos de un solo uso por WhatsApp.
  - name: payments-external
    description: Generación de QR de cobro bancario.
  - name: digital-trust
    description: >-
      Reputación digital: riesgo de correo, IP y dispositivo, e identidad
      sintética.
  - name: operations
    description: >-
      Back office: revisión de identidad, cumplimiento, observaciones, fraude y
      decisión de crédito.
  - name: internal-auth
    description: Autenticación del personal interno.
  - name: internal-users
    description: Usuarios internos, roles y permisos (RBAC interno).
  - name: internal-admin-views
    description: Vistas consolidadas para el portal administrativo.
  - name: internal-access-catalog
    description: 'Catálogo de accesos: qué puede ver y hacer cada rol interno.'
  - name: external-data-admin
    description: >-
      Administración de proveedores externos: modos, políticas de coste, SLA y
      consumo.
  - name: notifications
    description: >-
      Notificaciones multicanal, preferencias del destinatario y evidencia de
      entrega.
  - name: catalog-management
    description: >-
      Catálogos versionados, definiciones semánticas y mapeos de riesgo que
      consume el motor de decisión.
  - name: internal-portal
    description: Glosario de negocio, gobierno y trazabilidad para operadores internos.
  - name: workflow-catalog
    description: >-
      El recorrido estándar como dato versionado, y su verificación contra las
      rutas realmente montadas.
  - name: audit
    description: Registro de acciones de actores sobre recursos, con payload redactado.
  - name: events
    description: Eventos de dominio y outbox transaccional.
  - name: runtime-jobs
    description: >-
      Trabajos de fondo: outbox, eventos, sesiones, retención, notificaciones e
      idempotencia.
  - name: data-quality
    description: Indicadores de calidad del dato y sus reglas.
  - name: schema-management
    description: >-
      Gobierno del catálogo de esquema. El DDL físico sigue saliendo por
      migraciones revisadas en PR.
  - name: systems-ops
    description: Salud, catálogo y pruebas controladas del propio backend.
  - name: health
    description: Sondas de liveness y readiness. Públicas, sin autenticación.
servers:
  - url: http://localhost:3005
    description: Desarrollo local
  - url: https://api.staging.atlas.local
    description: Staging
  - url: https://api.atlas.local
    description: Producción
components:
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ApiError:
      type: object
      description: >-
        Sobre de error uniforme de la API. Lo emite el filtro global para
        CUALQUIER fallo, así que un cliente puede tratarlo de una sola forma sin
        importar el endpoint.
      required:
        - error
        - timestamp
      properties:
        requestId:
          type:
            - string
            - 'null'
          description: >-
            Identificador de correlación de la petición. Es el mismo valor del
            encabezado `x-correlation-id` (lo genera `CorrelationIdMiddleware`
            si el cliente no lo envía) y el que aparece en los logs, así que es
            lo que hay que citar al reportar una incidencia.
          example: 3f9a2c14-9d1e-4a1b-9f0c-6b5d2a7e8c31
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - VALIDATION_ERROR
                - UNAUTHORIZED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - GONE
                - PAYLOAD_TOO_LARGE
                - UNPROCESSABLE_ENTITY
                - RATE_LIMIT_EXCEEDED
                - INTERNAL_ERROR
                - SERVICE_UNAVAILABLE
              description: >-
                Código estable y legible por máquina. Es lo que hay que
                ramificar en el cliente, no el mensaje.
            message:
              type: string
              description: >-
                Mensaje orientado a personas. En los 5xx está saneado a
                propósito: la causa real queda en el log del servidor,
                correlacionada por `requestId`.
            issues:
              type: array
              description: >-
                Sólo en 400: el detalle campo a campo del fallo de validación.
                Ausente en el resto de errores.
              items:
                $ref: '#/components/schemas/ValidationIssue'
        timestamp:
          type: string
          format: date-time
          description: Momento en que el backend generó la respuesta, en UTC.
          example: '2026-07-31T13:00:00.000Z'
    ApiSuccess:
      type: object
      description: >-
        Sobre de éxito uniforme que aplica `ResponseInterceptor` a toda
        respuesta 2xx.
      required:
        - data
        - timestamp
      properties:
        requestId:
          type:
            - string
            - 'null'
          description: >-
            Identificador de correlación de la petición. Es el mismo valor del
            encabezado `x-correlation-id` (lo genera `CorrelationIdMiddleware`
            si el cliente no lo envía) y el que aparece en los logs, así que es
            lo que hay que citar al reportar una incidencia.
          example: 3f9a2c14-9d1e-4a1b-9f0c-6b5d2a7e8c31
        data:
          description: Carga útil de la operación. Su forma la declara cada endpoint.
        timestamp:
          type: string
          format: date-time
          description: Momento en que el backend generó la respuesta, en UTC.
          example: '2026-07-31T13:00:00.000Z'
    ValidationIssue:
      type: object
      description: >-
        Un fallo de validación concreto, tal y como lo reporta el esquema Zod
        del endpoint.
      required:
        - path
        - message
      properties:
        path:
          type: string
          description: Ruta del campo dentro del cuerpo o la query.
          example: body.email
        message:
          type: string
          description: Motivo del rechazo.
          example: Debe contener un correo válido
    PaginationMeta:
      type: object
      description: Metadatos de paginación de los listados que los exponen.
      required:
        - total
        - page
        - limit
        - totalPages
      properties:
        total:
          type: integer
          minimum: 0
          description: Total de elementos que cumplen el filtro.
        page:
          type: integer
          minimum: 1
          description: Página devuelta, empezando en 1.
        limit:
          type: integer
          minimum: 1
          description: Tamaño de página solicitado.
        totalPages:
          type: integer
          minimum: 0
          description: Número de páginas para ese `limit`.
  responses:
    BadRequest:
      description: >-
        La solicitud no cumple el esquema de validación. `error.issues` detalla
        cada campo rechazado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: >-
        Falta el token de acceso, está expirado, o su emisor/audiencia no son
        los esperados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: >-
        El actor está autenticado pero no tiene el rol requerido, o el
        `x-tenant-id` no coincide con su token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: >-
        El recurso no existe, o existe en otro tenant (que para este actor es lo
        mismo).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: >-
        El estado actual del recurso no admite la operación, o se viola una
        restricción única.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: >-
        Se superó el límite de peticiones del endpoint. Reintentar respetando
        `Retry-After`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalError:
      description: >-
        Fallo no controlado. El mensaje viene saneado; la causa está en el log,
        correlacionada por `requestId`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      description: >-
        Identificador de correlación propuesto por el cliente. Si no se envía,
        el backend genera uno. Viaja a los logs y vuelve en `requestId`, así que
        enviarlo permite seguir una operación de punta a punta.
      schema:
        type: string
    IdempotencyKey:
      name: x-idempotency-key
      in: header
      required: true
      description: >-
        Clave de idempotencia de la mutación. Reintentar con la misma clave
        devuelve el resultado de la primera ejecución en vez de ejecutar el
        comando dos veces.
      schema:
        type: string
    TenantId:
      name: x-tenant-id
      in: header
      required: true
      description: >-
        Tenant sobre el que se opera. `TenantGuard` lo contrasta contra el
        `tenantId` del token y responde 403 si no coinciden, así que no es un
        selector libre.
      schema:
        type: string
