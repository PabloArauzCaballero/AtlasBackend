# Reglas de alerta Prometheus para AtlasBackend (Fase 3.4 del plan 10/10).
#
# Se alimentan de las métricas expuestas en `GET /metrics` por `MetricsService`:
#   - http_requests_total{method,route,status_code,service}
#   - http_request_duration_seconds_bucket{le,method,route,status_code,service}  (histograma)
#
# Cárgalas en Prometheus con `rule_files: [ "prometheus-alerts.yml" ]`. Los umbrales son un punto de
# partida razonable para una API web; ajústalos al SLO acordado del servicio.
groups:
  - name: atlas-backend-slo
    rules:
      # --- Disponibilidad -------------------------------------------------------------------------
      - alert: AtlasBackendTargetDown
        expr: up{job="atlas-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 'AtlasBackend no responde al scrape'
          description: 'El target {{ $labels.instance }} lleva >2m sin responder a Prometheus.'

      # --- Tasa de error (SLI principal) ----------------------------------------------------------
      - alert: AtlasBackendHighErrorRate
        expr: |
          sum(rate(http_requests_total{status_code=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Tasa de error 5xx > 5%'
          description: 'La proporción de respuestas 5xx supera el 5% durante 5m (SLO de error).'

      - alert: AtlasBackendElevatedClientErrors
        expr: |
          sum(rate(http_requests_total{status_code=~"4.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.30
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Tasa de error 4xx > 30%'
          description: 'Muchos 4xx durante 10m: posible abuso, cliente mal integrado o validación rota.'

      # --- Latencia (p95 / p99) -------------------------------------------------------------------
      - alert: AtlasBackendHighP95Latency
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Latencia p95 > 1s'
          description: 'El p95 de latencia HTTP supera 1s durante 5m.'

      - alert: AtlasBackendHighP99Latency
        expr: |
          histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2.5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Latencia p99 > 2.5s'
          description: 'El p99 de latencia HTTP supera 2.5s durante 5m.'

      # --- Métricas de NEGOCIO --------------------------------------------------------------------
      - alert: AtlasCircuitBreakerOpen
        expr: atlas_circuit_breaker_state == 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'Circuit breaker ABIERTO para {{ $labels.provider }}'
          description: 'El breaker de {{ $labels.provider }} lleva >1m abierto: las llamadas se están cortando sin llegar al proveedor.'

      - alert: AtlasOutboxBacklogGrowing
        expr: atlas_outbox_pending_events > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Backlog del outbox > 1000 eventos (tenant {{ $labels.tenant_id }})'
          description: 'El outbox no está drenando: >1000 eventos pending durante 10m. Revisa el job process-outbox.'

      - alert: AtlasProviderFailureRateHigh
        expr: |
          sum by (provider) (rate(atlas_provider_calls_total{outcome="failure"}[10m]))
            / clamp_min(sum by (provider) (rate(atlas_provider_calls_total[10m])), 1e-9) > 0.20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Proveedor {{ $labels.provider }} fallando > 20%'
          description: 'Más del 20% de las llamadas a {{ $labels.provider }} fallan (10m). Precede a la apertura del breaker.'

      # --- Salud del proceso (métricas por defecto de prom-client) --------------------------------
      - alert: AtlasBackendEventLoopLag
        expr: nodejs_eventloop_lag_seconds > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Event loop lag > 200ms'
          description: 'El event loop de Node está saturado (>200ms de lag) durante 5m.'

      # --- Trabajos de fondo (hallazgo A-03) -----------------------------------------------------
      # Estos jobs pasaron de "los dispara alguien a mano" a "corren solos". Sin estas dos reglas, un
      # job que falla en cada tanda y un job que nadie programó se ven exactamente igual: silencio.
      - alert: AtlasScheduledJobFailing
        expr: sum by (job) (rate(atlas_scheduled_job_runs_total{outcome="failure"}[15m])) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Job programado {{ $labels.job }} fallando'
          description: 'El job {{ $labels.job }} falla de forma sostenida (15m). Revisa system_job_runs para el error por tenant.'

      - alert: AtlasRetentionJobNotRunning
        expr: sum(increase(atlas_scheduled_job_runs_total{job="apply_retention_policies",outcome="success"}[36h])) == 0
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: 'Las políticas de retención no se aplican desde hace >36h'
          description: >-
            El job apply_retention_policies no ha completado ninguna ejecución en 36h (corre cada 24h).
            En un backend KYC esto es incumplimiento de retención de datos personales, no solo un job caído.

      # --- Pool de conexiones a PostgreSQL (hallazgo A-10) ---------------------------------------
      - alert: AtlasDbPoolSaturated
        expr: atlas_db_pool_connections{state="waiting"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'Requests encolados esperando conexión a PostgreSQL'
          description: >-
            Hay peticiones esperando una conexión libre durante 5m: la latencia sube sin que ninguna
            query sea lenta. Sube DB_POOL_MAX o revisa transacciones que no cierran.

      # --- Autenticación (hallazgo A-10) ---------------------------------------------------------
      - alert: AtlasAuthFailureSpike
        expr: sum(rate(atlas_auth_attempts_total{outcome="invalid_password"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Pico sostenido de contraseñas inválidas'
          description: 'Más de 1 fallo de contraseña por segundo durante 10m: patrón compatible con credential stuffing.'

      - alert: AtlasAccountLockoutSpike
        expr: sum(rate(atlas_auth_attempts_total{outcome="account_locked"}[15m])) > 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Muchas cuentas bloqueadas por intentos fallidos'
          description: 'El lockout se está disparando de forma sostenida: ataque en curso o un cliente con credenciales mal configuradas.'

      # Los dos jobs añadidos al cerrar A-03: sin ellos, los mensajes de un broadcast interrumpido se
      # quedan en `pending` para siempre y `idempotency_keys` crece sin techo. Ambos son diarios o
      # cada 5 min, así que "no completó ninguno en 24 h" es señal inequívoca de que dejó de correr.
      - alert: AtlasNotificationRetryJobNotRunning
        expr: sum(increase(atlas_scheduled_job_runs_total{job="retry_stuck_notifications",outcome="success"}[6h])) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'El barrido de notificaciones atascadas no corre desde hace >6h'
          description: >-
            retry_stuck_notifications corre cada 5 min y no ha completado ninguna ejecución en 6 h.
            Los mensajes que quedaron en pending/sending tras un reinicio no se están reintentando.

      - alert: AtlasIdempotencyPurgeNotRunning
        expr: sum(increase(atlas_scheduled_job_runs_total{job="purge_idempotency_keys",outcome="success"}[48h])) == 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: 'La purga de claves de idempotencia no corre desde hace >48h'
          description: >-
            purge_idempotency_keys corre cada 24 h. Sin él, idempotency_keys crece sin techo y degrada
            el claim que protege cada comando con X-Idempotency-Key.

      # Separación de roles de proceso (docs/architecture/background-processing.md). Con la API y el
      # worker desplegados por separado, "el worker no está corriendo" es un fallo SILENCIOSO: nadie
      # recibe un error, simplemente el trabajo de fondo deja de ocurrir. `atlas_app_info` es una
      # serie de identidad que cada proceso publica siempre en 1, así que su ausencia es la señal.
      - alert: AtlasWorkerRoleAbsent
        expr: absent(atlas_app_info{role="worker"}) and absent(atlas_app_info{role="all"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Ningún proceso está ejecutando el trabajo de fondo'
          description: >-
            No hay ninguna instancia con role=worker ni role=all publicando métricas. El outbox no se
            despacha, las sesiones caducadas no expiran y las políticas de retención de datos
            personales no se aplican. Revisa el despliegue del contenedor `worker`.

      - alert: AtlasApiRoleAbsent
        expr: absent(atlas_app_info{role="api"}) and absent(atlas_app_info{role="all"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 'Ninguna instancia está atendiendo la API'
          description: 'No hay procesos con role=api ni role=all publicando métricas: el backend no atiende tráfico.'

      # Sólo aplica con NOTIFICATIONS_DELIVERY_MODE=deferred: en ese modo la API deja los mensajes en
      # `pending` y este job es el ÚNICO que los entrega. Si deja de correr, nadie recibe nada y no
      # hay ningún error visible en la API, que sigue respondiendo 200 al POST del broadcast.
      - alert: AtlasPendingNotificationDeliveryJobNotRunning
        expr: sum(increase(atlas_scheduled_job_runs_total{job="deliver_pending_notifications",outcome="success"}[1h])) == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: 'La entrega diferida de notificaciones no corre desde hace >1h'
          description: >-
            deliver_pending_notifications corre cada 10 s en modo deferred. Sin él, cada broadcast se
            persiste pero no llega a ningún destinatario, y la API no reporta ningún fallo.
