      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                productCode:
                  type: string
                  minLength: 2
                  maxLength: 60
                  pattern: ^[a-z0-9_-]+$
                productName:
                  type: string
                  minLength: 3
                  maxLength: 180
                description:
                  type: string
                  maxLength: 2000
                currencyCode:
                  type: string
                  minLength: 3
                  maxLength: 3
                minAmount:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 99999999
                maxAmount:
                  type: number
                  exclusiveMinimum: 0
                  maximum: 99999999
                minTermMonths:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 360
                maxTermMonths:
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 360
                annualInterestRate:
                  type: number
                  minimum: 0
                  maximum: 999
                minMonthlyIncome:
                  type: number
                  minimum: 0
                  maximum: 99999999
                requiresManualReview:
                  default: false
                  type: boolean
                effectiveFrom:
                  type: string
                  format: date-time
                  pattern: >-
                    ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                effectiveUntil:
                  type: string
                  format: date-time
                  pattern: >-
                    ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
              required:
                - productCode
                - productName
                - currencyCode
                - minAmount
                - maxAmount
                - minTermMonths
                - maxTermMonths
                - requiresManualReview
              additionalProperties: false
      responses:
        '201':
          description: Producto creado en estado `draft`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: CREDIT_PRODUCT_CODE_ALREADY_EXISTS.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Crear un producto crediticio
