openapi: 3.1.0
paths:
  /operations/jobs/process-outbox:
    post:
      description: Job de mantenimiento. Restringido a admin/platform_admin/system.
      operationId: RuntimeJobsController_processOutbox
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  default: 50
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 500
                dryRun:
                  default: true
                  type: boolean
              required:
                - limit
                - dryRun
              additionalProperties: false
      responses:
        '200':
          description: Resultado del procesamiento del outbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Procesar el outbox de eventos pendientes
      tags:
        - runtime-jobs
  /operations/jobs/process-events:
    post:
      description: Job de mantenimiento. Restringido a admin/platform_admin/system.
      operationId: RuntimeJobsController_processEvents
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  default: 50
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 500
                dryRun:
                  default: true
                  type: boolean
              required:
                - limit
                - dryRun
              additionalProperties: false
      responses:
        '200':
          description: Resultado del procesamiento de eventos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Procesar eventos de dominio pendientes
      tags:
        - runtime-jobs
  /operations/jobs/expire-stale-sessions:
    post:
      description: Job de mantenimiento. Restringido a admin/platform_admin/system.
      operationId: RuntimeJobsController_expireStaleSessions
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maxIdleMinutes:
                  default: 120
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 43200
                dryRun:
                  default: true
                  type: boolean
              required:
                - maxIdleMinutes
                - dryRun
              additionalProperties: false
      responses:
        '200':
          description: Resultado de la expiración de sesiones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Expirar sesiones inactivas
      tags:
        - runtime-jobs
  /operations/jobs/retry-stuck-notifications:
    post:
      description: >-
        Reintenta los mensajes que quedaron en pending/sending (p. ej. porque el
        proceso se reinició a mitad de un broadcast). Job de mantenimiento.
        Restringido a admin/platform_admin/system.
      operationId: RuntimeJobsController_retryStuckNotifications
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                olderThanMinutes:
                  default: 15
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 1440
                limit:
                  default: 100
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 500
                dryRun:
                  default: true
                  type: boolean
              required:
                - olderThanMinutes
                - limit
                - dryRun
              additionalProperties: false
      responses:
        '200':
          description: Resultado del reintento de notificaciones atascadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Reintentar notificaciones atascadas
      tags:
        - runtime-jobs
  /operations/jobs/deliver-pending-notifications:
    post:
      description: >-
        Entrega los mensajes que el request dejó en pending cuando
        NOTIFICATIONS_DELIVERY_MODE=deferred. A diferencia de
        retry-stuck-notifications, no aplica corte por antigüedad: busca lo
        recién creado. Job de mantenimiento. Restringido a
        admin/platform_admin/system.
      operationId: RuntimeJobsController_deliverPendingNotifications
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  default: 100
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 500
                dryRun:
                  default: true
                  type: boolean
              required:
                - limit
                - dryRun
              additionalProperties: false
      responses:
        '200':
          description: Resultado de la entrega de notificaciones pendientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Entregar notificaciones pendientes
      tags:
        - runtime-jobs
  /operations/jobs/purge-idempotency-keys:
    post:
      description: >-
        Borra las claves completed/failed anteriores al período de retención.
        Las claves en processing nunca se tocan: podrían pertenecer a una
        petición en vuelo. Restringido a admin/platform_admin/system.
      operationId: RuntimeJobsController_purgeIdempotencyKeys
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                retentionDays:
                  default: 30
                  type: integer
                  minimum: 1
                  maximum: 365
                limit:
                  default: 1000
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 10000
                dryRun:
                  default: true
                  type: boolean
              required:
                - retentionDays
                - limit
                - dryRun
              additionalProperties: false
      responses:
        '200':
          description: Resultado de la purga de claves de idempotencia.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Purgar claves de idempotencia resueltas
      tags:
        - runtime-jobs
  /operations/jobs/apply-retention-policies:
    post:
      description: Job de mantenimiento. Restringido a admin/platform_admin/system.
      operationId: RuntimeJobsController_applyRetentionPolicies
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                policyCode:
                  type: string
                  minLength: 1
                  maxLength: 120
                dryRun:
                  default: true
                  type: boolean
              required:
                - dryRun
              additionalProperties: false
      responses:
        '200':
          description: Resultado de la aplicación de políticas de retención.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Aplicar políticas de retención de datos
      tags:
        - runtime-jobs
  /operations/jobs/recalculate-data-quality:
    post:
      description: Job de mantenimiento. Restringido a admin/platform_admin/system.
      operationId: RuntimeJobsController_recalculateDataQuality
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customerId:
                  type: string
                  pattern: ^[1-9][0-9]*$
                dryRun:
                  default: true
                  type: boolean
              required:
                - dryRun
              additionalProperties: false
      responses:
        '200':
          description: Resultado del recálculo de calidad de datos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Recalcular métricas de calidad de datos
      tags:
        - runtime-jobs
  /operations/events/catalog:
    get:
      operationId: EventsController_listCatalog
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Lista de definiciones de eventos registradas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Catálogo de definiciones de eventos de dominio
      tags:
        - events
  /operations/events:
    get:
      description: >-
        Soporta paginación por offset (page/limit) o por cursor
        (pagination=cursor).
      operationId: EventsController_listEvents
      parameters:
        - name: cursor
          required: false
          in: query
          schema:
            type: string
            maxLength: 500
          description: >-
            Cursor opaco devuelto por la página anterior. Los listados con
            cursor no aceptan `page`: son excluyentes, porque paginar por
            desplazamiento sobre datos que cambian salta o repite filas.
        - name: pagination
          required: false
          in: query
          schema:
            default: offset
            type: string
            enum:
              - offset
              - cursor
          description: >-
            Estrategia de paginación pedida (`page` u `offset`) cuando el
            listado admite ambas.
        - name: limit
          required: false
          in: query
          schema:
            default: 20
            type: integer
            exclusiveMinimum: 0
            maximum: 100
          description: >-
            Tamaño de página. El backend impone un máximo por endpoint; pedir
            más lo recorta en vez de fallar.
        - name: page
          required: false
          in: query
          schema:
            default: 1
            type: integer
            exclusiveMinimum: 0
            maximum: 9007199254740991
          description: Página solicitada, empezando en 1.
        - name: correlationId
          required: false
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 120
          description: >-
            Filtra por el identificador de correlación con el que se registró la
            operación.
        - name: aggregateType
          required: false
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 120
          description: Filtra por tipo de agregado al que pertenece el evento.
        - name: eventCode
          required: false
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 160
          description: Filtra por código del evento en el catálogo de definiciones.
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - pending
              - processing
              - processed
              - failed
              - cancelled
          description: >-
            Filtra por estado del recurso. Los valores admitidos son los del
            dominio de ese recurso.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Lista paginada de eventos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Listar eventos de dominio (outbox)
      tags:
        - events
    post:
      operationId: EventsController_createEvent
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventCode:
                  type: string
                  minLength: 3
                  maxLength: 160
                aggregateType:
                  type: string
                  minLength: 2
                  maxLength: 120
                aggregateId:
                  anyOf:
                    - type: string
                      maxLength: 120
                    - type: 'null'
                payload:
                  default: {}
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                metadata:
                  default: {}
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties: {}
                priority:
                  type: integer
                  minimum: 0
                  maximum: 1000
                availableAt: {}
                maxAttempts:
                  default: 3
                  type: integer
                  exclusiveMinimum: 0
                  maximum: 10
                idempotencyKey:
                  type: string
                  minLength: 8
                  maxLength: 180
                correlationId:
                  anyOf:
                    - type: string
                      maxLength: 120
                    - type: 'null'
                causationId:
                  anyOf:
                    - type: string
                      maxLength: 120
                    - type: 'null'
                sourceModule:
                  anyOf:
                    - type: string
                      maxLength: 120
                    - type: 'null'
                sourceAction:
                  anyOf:
                    - type: string
                      maxLength: 120
                    - type: 'null'
              required:
                - eventCode
                - aggregateType
                - payload
                - metadata
                - maxAttempts
              additionalProperties: false
      responses:
        '201':
          description: Evento publicado (encolado en outbox).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Publicar un evento de dominio
      tags:
        - events
  /operations/events/{eventId}:
    get:
      operationId: EventsController_getEvent
      parameters:
        - name: eventId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: Identificador del evento de dominio en el outbox.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Detalle del evento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: EVENT_NOT_FOUND.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Obtener un evento de dominio
      tags:
        - events
  /operations/events/{eventId}/retry:
    post:
      operationId: EventsController_retryEvent
      parameters:
        - name: eventId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: Identificador del evento de dominio en el outbox.
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Evento re-encolado para reintento.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: EVENT_NOT_FOUND.
        '409':
          description: EVENT_NOT_RETRYABLE.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Reintentar un evento fallido
      tags:
        - events
  /operations/events/{eventId}/cancel:
    post:
      operationId: EventsController_cancelEvent
      parameters:
        - name: eventId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: Identificador del evento de dominio en el outbox.
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Evento cancelado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: EVENT_NOT_FOUND.
        '409':
          description: EVENT_NOT_CANCELLABLE.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Cancelar un evento pendiente
      tags:
        - events
  /operations/notifications/messages:
    get:
      operationId: NotificationsController_listMessages
      parameters:
        - name: channel
          required: false
          in: query
          schema:
            type: string
            enum:
              - in_app
              - push
              - email
              - sms
              - whatsapp
              - phone
          description: Canal de comunicación (`email`, `sms`, `push`, `whatsapp`).
        - name: status
          required: false
          in: query
          schema:
            type: string
            enum:
              - pending
              - queued
              - sending
              - sent
              - delivered
              - read
              - failed
              - retrying
              - cancelled
          description: >-
            Filtra por estado del recurso. Los valores admitidos son los del
            dominio de ese recurso.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Lista paginada de mensajes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Listar mensajes de notificación (operaciones)
      tags:
        - notifications
  /operations/notifications/messages/{messageId}:
    get:
      description: Incluye el historial de intentos de entrega (deliveries) del mensaje.
      operationId: NotificationsController_getMessage
      parameters:
        - name: messageId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: Identificador del mensaje de notificación.
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Detalle del mensaje con sus deliveries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: NOTIFICATION_MESSAGE_NOT_FOUND.
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
        - access-token: []
      summary: Detalle de un mensaje de notificación (operaciones)
      tags:
        - notifications
  /operations/notifications/messages/{messageId}/retry:
    post:
      operationId: NotificationsController_retryMessage
      parameters:
        - name: messageId
          required: true
          in: path
          schema:
            type: string
            pattern: ^[1-9][0-9]*$
          description: Identificador del mensaje de notificación.
