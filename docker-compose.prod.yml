# Forma PRODUCTIVA del despliegue de Atlas Backend.
#
# Diferencias con `docker-compose.yml` (que es el stack local) y por qué:
#
#   1. NINGÚN secreto ni credencial por defecto. Todo llega del entorno del host o del gestor de
#      secretos: `${DB_PASSWORD:?...}` hace que Compose ABORTE si la variable falta, en vez de
#      arrancar con un valor de ejemplo. Un despliegue a medias es peor que uno que no arranca.
#   2. Sin PostgreSQL, Redis ni MongoDB: en producción son servicios gestionados, con sus copias de
#      seguridad y su alta disponibilidad. Meterlos aquí invitaría a correr la base de datos de un
#      fintech en un contenedor efímero.
#   3. La imagen se TRAE de un registro (`${ATLAS_IMAGE}`), no se construye en el host de producción.
#      Lo que se despliega es exactamente el artefacto que CI construyó y escaneó.
#   4. API y worker escalan por separado, que es la razón de existir de la separación de roles.
#   5. Sistema de archivos de solo lectura salvo los puntos que el proceso necesita escribir.
#
# Uso:
#   export ATLAS_IMAGE=registry.example.com/atlas-backend:1.4.2
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml up -d --scale api=4 --scale worker=1
#
# `worker` NO debe escalarse por encima de 1 sin necesidad: la elección de líder por Redis ya impide
# que dos instancias procesen el mismo lote, así que réplicas extra sólo aportan tolerancia a fallos.
#
# Ver docs/runbooks/despliegue-produccion.md y docs/architecture/background-processing.md.

x-atlas-image: &atlas-image
  image: ${ATLAS_IMAGE:?Define ATLAS_IMAGE con la imagen construida por CI, p. ej. registry/atlas-backend:1.4.2}
  # `no-new-privileges` impide que un binario setuid dentro del contenedor eleve privilegios.
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    # El proceso no escribe fuera de /tmp y /app/logs; con el resto en solo lectura, un atacante que
    # logre ejecución no puede dejar nada persistente en la imagen.
    - /tmp
  logging:
    driver: json-file
    options:
      max-size: '20m'
      max-file: '5'

x-atlas-env: &atlas-env
  NODE_ENV: production
  # `LOG_FORMAT=json` es el default en producción, pero se explicita: es lo que hace que stdout lleve
  # la misma línea redactada y correlacionada que el archivo (hallazgo A-04).
  LOG_FORMAT: json
  APP_VERSION: ${APP_VERSION:-}
  APP_COMMIT_SHA: ${APP_COMMIT_SHA:-}
  DB_HOST: ${DB_HOST:?Falta DB_HOST}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:?Falta DB_NAME}
  DB_USER: ${DB_USER:?Falta DB_USER}
  DB_PASSWORD: ${DB_PASSWORD:?Falta DB_PASSWORD}
  DB_SCHEMA: ${DB_SCHEMA:-public}
  DB_SSL: ${DB_SSL:-true}
  DB_SSL_REJECT_UNAUTHORIZED: 'true'
  # Redis es obligatorio en producción: sin él, el rate limiting sólo protege por instancia y la
  # elección de líder de los jobs no existe. `env.ts` ya lo exige; aquí se falla antes de arrancar.
  REDIS_URL: ${REDIS_URL:?Falta REDIS_URL}
  JWT_ACCESS_TOKEN_SECRET: ${JWT_ACCESS_TOKEN_SECRET:?Falta JWT_ACCESS_TOKEN_SECRET}
  JWT_ISSUER: ${JWT_ISSUER:?Falta JWT_ISSUER}
  JWT_AUDIENCE: ${JWT_AUDIENCE:?Falta JWT_AUDIENCE}
  NOTIFICATION_TOKEN_ENCRYPTION_KEY: ${NOTIFICATION_TOKEN_ENCRYPTION_KEY:?Falta NOTIFICATION_TOKEN_ENCRYPTION_KEY}
  CORS_ORIGINS: ${CORS_ORIGINS:?Falta CORS_ORIGINS}
  INTERNAL_FRONTEND_ORIGIN: ${INTERNAL_FRONTEND_ORIGIN:?Falta INTERNAL_FRONTEND_ORIGIN}
  # --- Origen de las semillas ---------------------------------------------------------------
  # Apuntan a la rama de PostgreSQL que publica el conjunto sembrado (el dato maestro: catálogos,
  # políticas, tipos). Si este despliegue no tiene que sembrar, se dejan vacías y el job `migrate`
  # se salta el paso DICIÉNDOLO. Los seeders versionados ya no existen en el repositorio.
  SEED_SOURCE_DATABASE_URL: ${SEED_SOURCE_DATABASE_URL:-}
  SEED_SOURCE_HOST: ${SEED_SOURCE_HOST:-}
  SEED_SOURCE_PORT: ${SEED_SOURCE_PORT:-5432}
  SEED_SOURCE_DB: ${SEED_SOURCE_DB:-atlas}
  SEED_SOURCE_USER: ${SEED_SOURCE_USER:-}
  SEED_SOURCE_PASSWORD: ${SEED_SOURCE_PASSWORD:-}
  SEED_SOURCE_SSL: ${SEED_SOURCE_SSL:-true}
  SEED_SOURCE_SSL_REJECT_UNAUTHORIZED: ${SEED_SOURCE_SSL_REJECT_UNAUTHORIZED:-true}

  # Mayor que el intervalo del readiness probe del balanceador. Ver docs/runbooks/despliegue-produccion.md.
  SHUTDOWN_DRAIN_MS: ${SHUTDOWN_DRAIN_MS:-15000}
  REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
  API_PREFIX: ${API_PREFIX:-api/v1}
  LOG_LEVEL: ${LOG_LEVEL:-info}

  # --- Identidades de base adicionales --------------------------------------------------------
  # El job `migrate` las sobreescribe con las suyas; aquí se declaran para que existan en TODOS los
  # procesos: `env.ts` comprueba que la identidad de migración sea DISTINTA de la de runtime, y sin
  # declararla no puede distinguir «no configurado» de «configurado igual».
  DB_MIGRATION_USER: ${DB_MIGRATION_USER:?Falta DB_MIGRATION_USER}
  DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:?Falta DB_MIGRATION_PASSWORD}
  DB_POOL_MAX: ${DB_POOL_MAX:-20}
  DB_POOL_MIN: ${DB_POOL_MIN:-2}
  DB_READ_ENABLED: ${DB_READ_ENABLED:-false}
  DB_READ_HOST: ${DB_READ_HOST:-}
  DB_READ_PORT: ${DB_READ_PORT:-5432}
  DB_READ_USER: ${DB_READ_USER:-}
  DB_READ_PASSWORD: ${DB_READ_PASSWORD:-}
  # Sembrar al arrancar es de desarrollo: en producción el dato maestro entra por el job `migrate`,
  # una sola vez y con la identidad DDL. Un `true` aquí cargaría catálogos en cada réplica.
  DATABASE_SEED_ON_STARTUP: 'false'
  DB_LOG_SQL: 'false'

  # --- Almacenamiento de archivos -------------------------------------------------------------
  # SIN ESTO EL PROCESO NO ARRANCA: `FILE_STORAGE_ADAPTER` vale `minio` por defecto y
  # `FileAdapterRegistry` valida la configuración del almacén al iniciar. Además, el contenedor es
  # `read_only`, así que el adaptador `local` tampoco sería una salida: no hay disco donde escribir.
  FILE_STORAGE_ADAPTER: ${FILE_STORAGE_ADAPTER:-minio}
  FILE_INGEST_ADAPTER: ${FILE_INGEST_ADAPTER:-multer}
  FILE_STORAGE_MINIO_KEY_PREFIX: ${FILE_STORAGE_MINIO_KEY_PREFIX:-files}
  STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
  STORAGE_S3_PUBLIC_ENDPOINT: ${STORAGE_S3_PUBLIC_ENDPOINT:-}
  STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
  STORAGE_S3_REGION: ${STORAGE_S3_REGION:-us-east-1}
  STORAGE_S3_ACCESS_KEY_ID: ${STORAGE_S3_ACCESS_KEY_ID:-}
  STORAGE_S3_SECRET_ACCESS_KEY: ${STORAGE_S3_SECRET_ACCESS_KEY:-}
  STORAGE_S3_FORCE_PATH_STYLE: ${STORAGE_S3_FORCE_PATH_STYLE:-true}

  # --- Cifrado de PII -------------------------------------------------------------------------
  # SIN ESTO EL PROCESO NO ARRANCA. O KMS de verdad, o declarar el riesgo por escrito: la master key
  # de TODA la PII saldría de una variable de entorno y comprometerla descifra el histórico entero.
  KMS_KEY_ID: ${KMS_KEY_ID:-}
  AWS_REGION: ${AWS_REGION:-}
  PII_ENCRYPTION_ALLOW_ENV_MASTER_KEY: ${PII_ENCRYPTION_ALLOW_ENV_MASTER_KEY:-false}
  PII_ENCRYPTION_MASTER_KEY: ${PII_ENCRYPTION_MASTER_KEY:-}

  # --- Canal de correo ------------------------------------------------------------------------
  # SIN ESTO EL PROCESO NO ARRANCA: es el que entrega el PIN del segundo factor de los actores
  # internos y los códigos de recuperación. Se admite MailSender (las cuatro) o Gmail API (las suyas).
  NOTIFICATION_EMAIL_PROVIDER: ${NOTIFICATION_EMAIL_PROVIDER:-disabled}
  MAILSENDER_BASE_URL: ${MAILSENDER_BASE_URL:-}
  MAILSENDER_API_PREFIX: ${MAILSENDER_API_PREFIX:-api/v1}
  MAILSENDER_EXTERNAL_API_KEY: ${MAILSENDER_EXTERNAL_API_KEY:-}
  MAILSENDER_ADMIN_USERNAME: ${MAILSENDER_ADMIN_USERNAME:-}
  MAILSENDER_ADMIN_PASSWORD: ${MAILSENDER_ADMIN_PASSWORD:-}
  GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:-}
  GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:-}
  GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:-}
  GMAIL_FROM_EMAIL: ${GMAIL_FROM_EMAIL:-}
  GMAIL_FROM_NAME: ${GMAIL_FROM_NAME:-Atlas}

  # --- Otros canales de notificación ----------------------------------------------------------
  # Apagados de oficio: encender uno exige credenciales del proveedor, y un canal encendido sin
  # ellas falla en la entrega, no al arrancar. Se decide canal por canal, nunca por descuido.
  NOTIFICATION_PUSH_PROVIDER: ${NOTIFICATION_PUSH_PROVIDER:-disabled}
  NOTIFICATION_SMS_PROVIDER: ${NOTIFICATION_SMS_PROVIDER:-disabled}
  NOTIFICATION_WHATSAPP_PROVIDER: ${NOTIFICATION_WHATSAPP_PROVIDER:-disabled}
  NOTIFICATION_PHONE_PROVIDER: ${NOTIFICATION_PHONE_PROVIDER:-disabled}
  NOTIFICATION_DEFAULT_LOCALE: ${NOTIFICATION_DEFAULT_LOCALE:-es}

  # --- Motor de decisiones y ERP --------------------------------------------------------------
  DECISION_ENGINE_BASE_URL: ${DECISION_ENGINE_BASE_URL:-}
  DECISION_ENGINE_API_KEY: ${DECISION_ENGINE_API_KEY:-}
  DECISION_ENGINE_OUTCOME_API_KEY: ${DECISION_ENGINE_OUTCOME_API_KEY:-}
  DECISION_ENGINE_GOVERNANCE_API_KEY: ${DECISION_ENGINE_GOVERNANCE_API_KEY:-}
  DECISION_ENGINE_AUDIO_API_KEY: ${DECISION_ENGINE_AUDIO_API_KEY:-}
  DECISION_ENGINE_STATEMENT_API_KEY: ${DECISION_ENGINE_STATEMENT_API_KEY:-}
  DECISION_ENGINE_SUBJECT_SALT: ${DECISION_ENGINE_SUBJECT_SALT:-}
  DECISION_ENGINE_CREDIT_ARTIFACT: ${DECISION_ENGINE_CREDIT_ARTIFACT:-ATLAS_BNPL_UNDERWRITING}
  DECISION_ENGINE_IDENTITY_ARTIFACT: ${DECISION_ENGINE_IDENTITY_ARTIFACT:-IDENTIDAD_CARNET_MOVIL}
  DECISION_ENGINE_RISK_ARTIFACT: ${DECISION_ENGINE_RISK_ARTIFACT:-RIESGO_ONBOARDING_CLIENTE}
  # Mayúsculas obligatorias: el esquema exige /^[A-Z0-9_-]{2,40}$/ (lo cazó el ensayo de arranque).
  DECISION_ENGINE_ENVIRONMENT_CODE: ${DECISION_ENGINE_ENVIRONMENT_CODE:-PRODUCTION}
  # Sin esta clave, la revisión humana de identidad que resuelve el Motor responde 401 SIEMPRE y el
  # intento se queda IN_REVIEW para siempre: el cliente no puede pedir crédito y nada avisa.
  ENGINE_CALLBACK_API_KEY: ${ENGINE_CALLBACK_API_KEY:-}
  ERP_BACKEND_BASE_URL: ${ERP_BACKEND_BASE_URL:-}
  ERP_BACKEND_CATALOG_API_KEY: ${ERP_BACKEND_CATALOG_API_KEY:-}

  # --- Proveedores externos -------------------------------------------------------------------
  # `disabled` responde un error explícito; el modo simulado respondía un DATO FALSO y lo persistía
  # como evidencia del cliente (hallazgo A-02). Cada proveedor se enciende con sus credenciales.
  EXTERNAL_PROVIDERS_ALLOW_MOCK_IN_PRODUCTION: 'false'
  SEGIP_MODE: ${SEGIP_MODE:-disabled}
  INFOCENTER_MODE: ${INFOCENTER_MODE:-disabled}
  QR_GENERIC_MODE: ${QR_GENERIC_MODE:-disabled}
  BANKING_GENERIC_MODE: ${BANKING_GENERIC_MODE:-disabled}
  TELCO_GENERIC_MODE: ${TELCO_GENERIC_MODE:-disabled}
  FACEBOOK_META_MODE: ${FACEBOOK_META_MODE:-disabled}
  WHATSAPP_GENERIC_MODE: ${WHATSAPP_GENERIC_MODE:-disabled}
  DIGITAL_TRUST_GENERIC_MODE: ${DIGITAL_TRUST_GENERIC_MODE:-disabled}

  # --- Identidad entre contextos (piloto de Mensajería) ---------------------------------------
  CONTEXT_SERVICE_TOKEN_SECRET: ${CONTEXT_SERVICE_TOKEN_SECRET:-}
  CUSTOMERS_DIRECTORY_URL: ${CUSTOMERS_DIRECTORY_URL:-}
  EVENTS_RELAY_V2_ENABLED: ${EVENTS_RELAY_V2_ENABLED:-false}

  # --- Sesiones y cookies ---------------------------------------------------------------------
  AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
  AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
  AUTH_LOGIN_PIN_ENABLED: ${AUTH_LOGIN_PIN_ENABLED:-true}

  # --- Bitácora en Mongo (opcional) -----------------------------------------------------------
  MONGO_DB_URL_CONNECTION: ${MONGO_DB_URL_CONNECTION:-}
  LOG_SYNC_FILE_PATH: ${LOG_SYNC_FILE_PATH:-/app/logs/Archivo.log}

services:
  # Job de despliegue: corre UNA vez, antes que la API y el worker, y con una identidad de base de
  # datos distinta (`DB_MIGRATION_USER`) que sí tiene privilegios DDL. El runtime no los tiene.
  migrate:
    <<: *atlas-image
    environment:
      <<: *atlas-env
      APP_ROLE: all
      DB_USER: ${DB_MIGRATION_USER:?Falta DB_MIGRATION_USER}
      DB_PASSWORD: ${DB_MIGRATION_PASSWORD:?Falta DB_MIGRATION_PASSWORD}
    # Migrar SIEMPRE, reaplicar privilegios SIEMPRE, sembrar SÓLO si hay origen declarado.
    #
    # Los privilegios van aquí y no sólo en el guion del DBA porque `ALTER DEFAULT PRIVILEGES` sólo
    # alcanza a los schemas que existían al ejecutarlo: en un aprovisionamiento nuevo el guion corre
    # sobre una base VACÍA, las migraciones crean los quince schemas después, y las tablas nacen sin
    # un solo permiso para el rol de runtime. Medido: 30 de 202 tablas ilegibles para `atlas_app_rw`.
    #
    # Antes decía `seed.js up --profile=production`, y ese comando NO EXISTE desde que los seeders
    # versionados salieron del repositorio: el runner sólo admite `pull [--if-empty]` y `status`, así
    # que el job moría con «Comando de seed no soportado: up», y como `api` y `worker` esperan su
    # `service_completed_successfully`, NINGUNO de los dos llegaba a arrancar. El síntoma no menciona
    # las semillas: se ve todo EXITED.
    #
    # El `if` separa «este despliegue no siembra» —legítimo y frecuente— de «la siembra falló», que
    # sí debe parar el despliegue. `--if-empty` mira la marca de siembra: no pisa una base ya cargada.
    command:
      - sh
      - -c
      - >
        node dist/src/database/migrate.js up &&
        node dist/src/database/apply-grants.js &&
        if [ -n "$${SEED_SOURCE_DATABASE_URL}$${SEED_SOURCE_HOST}" ]; then
        node dist/src/database/seed.js pull --if-empty;
        else echo 'sin SEED_SOURCE_*: se migra pero no se siembra'; fi
    restart: 'no'

  api:
    <<: *atlas-image
    environment:
      <<: *atlas-env
      APP_ROLE: api
      APP_PORT: '3005'
      # El trabajo de fondo NO corre en las réplicas que atienden clientes. El cross-check de
      # `env.ts` rechaza `APP_ROLE=api` con el planificador encendido, así que esto no puede
      # desalinearse en silencio.
      RUNTIME_JOBS_SCHEDULER_ENABLED: 'false'
      NOTIFICATIONS_DELIVERY_MODE: deferred
    ports:
      - '${API_PUBLISH_PORT:-3005}:3005'
    volumes:
      - atlas-api-logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Debe superar SHUTDOWN_DRAIN_MS: si Docker matara el contenedor durante el drenado, drenar no
    # serviría de nada y cada despliegue seguiría tirando peticiones.
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          memory: 512M

  worker:
    <<: *atlas-image
    environment:
      <<: *atlas-env
      APP_ROLE: worker
      WORKER_PROBE_PORT: '3006'
      RUNTIME_JOBS_SCHEDULER_ENABLED: 'true'
      # Sin Redis no arranca (fail-closed): con varias instancias no hay forma de impedir que
      # procesen el mismo lote. Se deja explícito para que nadie lo active por descuido.
      RUNTIME_JOBS_ALLOW_WITHOUT_LOCK: 'false'
      NOTIFICATIONS_DELIVERY_MODE: deferred
      SYSTEM_HEALTH_MONITOR_ENABLED: 'true'
    # El `CMD` de la imagen es el de la API (`main.js`). Sin esta línea, el worker arrancaba el
    # entrypoint equivocado y `AtlasBootstrap` lo mataba en el acto —«APP_ROLE=worker: este
    # entrypoint es el de la API»— una y otra vez: `restart: unless-stopped` lo devolvía al bucle y
    # el trabajo de fondo (outbox, notificaciones, retención, expiración de sesiones) no corría NUNCA.
    command: ['node', 'dist/src/worker.js']
    # SIN `ports`: la sonda y `/metrics` del worker se quedan en la red interna. Prometheus hace
    # scrape desde dentro; publicarlo expondría métricas operativas a internet sin autenticación.
    expose:
      - '3006'
    volumes:
      - atlas-worker-logs:/app/logs
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Más holgado que el de la API: una tanda de jobs en curso debe poder terminar. El planificador
    # comprueba `stopped` entre tenants, así que aborta en el siguiente límite limpio.
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          memory: 384M

volumes:
  # Cada rol escribe su propio Archivo.log y lo sincroniza a MongoDB por su cuenta: el tail del log
  # es per-proceso, así que un volumen compartido mezclaría dos flujos y ambos competirían por el
  # mismo offset.
  atlas-api-logs:
  atlas-worker-logs:
